    &lt;script&gt;

        const puzzles = [
            {
                type: &quot;연역적 추론 (소거법)&quot;,
                title: &quot;도둑은 누구인가?&quot;,
                desc: `보석 가게에 도둑이 들었습니다. 용의자는 A, B, C, D 4명입니다. 경찰 조사 결과 다음 사실이 밝혀졌습니다.&lt;br&gt;&lt;br&gt;
                1. 범인은 정확히 1명입니다.&lt;br&gt;
                2. A: &quot;저는 훔치지 않았습니다.&quot;&lt;br&gt;
                3. B: &quot;C가 훔쳤습니다.&quot;&lt;br&gt;
                4. C: &quot;D가 훔쳤습니다.&quot;&lt;br&gt;
                5. D: &quot;C는 거짓말을 하고 있습니다.&quot;&lt;br&gt;&lt;br&gt;
                **이 중 단 한 명만 진실을 말하고 있다면**, 진짜 도둑은 누구일까요?`,
                options: [&quot;용의자 A&quot;, &quot;용의자 B&quot;, &quot;용의자 C&quot;, &quot;용의자 D&quot;],
                correctIndex: 0, // 수정됨 (아래 코드의 초기화 버그 대응)
                logicPath: [
                    &quot;조건: 4명 중 1명만 진실, 3명은 거짓말을 함.&quot;,
                    &quot;C의 발언(D가 훔침)과 D의 발언(C가 거짓말함)은 서로 모순됨. 즉, 둘 중 하나는 반드시 참이고 하나는 반드시 거짓임.&quot;,
                    &quot;유일한 &#x27;참&#x27;이 C나 D 중 하나에게 있으므로, A와 B의 발언은 무조건 &#x27;거짓&#x27;이 됨.&quot;,
                    &quot;A의 발언 &#x27;저는 훔치지 않았습니다&#x27;가 거짓이므로, A가 훔친 것이 됨.&quot;,
                    &quot;잠깐, A가 도둑이라면? B의 발언(C가 훔침)은 거짓이 됨 (성립). C의 발언(D가 훔침)도 거짓이 됨 (성립).&quot;,
                    &quot;C의 발언이 거짓이므로, D의 발언(C가 거짓말함)은 진실이 됨 (성립).&quot;,
                    &quot;따라서 유일하게 진실을 말한 사람은 D이며, 도둑은 A임. (AI는 모순되는 명제 쌍을 찾아 범위를 좁힙니다.)&quot;
                ],
                aiExplanation: &quot;이러한 추론은 AI 분야에서 &lt;strong&gt;&#x27;제약 조건 만족 문제(Constraint Satisfaction Problem, CSP)&#x27;&lt;/strong&gt;와 깊은 관련이 있습니다. 초기 인공지능(전문가 시스템)은 이처럼 수많은 명제(규칙)들 사이에서 모순되는 조건들을 소거해 나가며 유일한 해답을 찾는 논리 프로그래밍(예: Prolog) 방식을 주로 사용했습니다. 스도쿠를 푸는 AI나 체스 등에서 불가능한 경우의 수를 빠르게 가지치기할 때 이 원리가 쓰입니다.&quot;
            },
            {
                type: &quot;알고리즘적 사고 (상태 공간 탐색)&quot;,
                title: &quot;다리 건너기 문제&quot;,
                desc: `4명의 사람(A, B, C, D)이 밤에 흔들리는 다리를 건너야 합니다. 손전등은 1개뿐이며, 다리는 최대 2명까지만 버틸 수 있습니다. 손전등 없이는 건널 수 없고, 2명이 건널 때는 더 느린 사람의 속도에 맞춰야 합니다.&lt;br&gt;&lt;br&gt;
                - A는 건너는 데 1분 소요&lt;br&gt;
                - B는 건너는 데 2분 소요&lt;br&gt;
                - C는 건너는 데 5분 소요&lt;br&gt;
                - D는 건너는 데 10분 소요&lt;br&gt;&lt;br&gt;
                **가장 빠른 시간 안에 모두가 다리를 건너려면 최소 몇 분이 걸릴까요?**`,
                options: [&quot;17분&quot;, &quot;19분&quot;, &quot;21분&quot;, &quot;23분&quot;],
                correctIndex: 0, // 17분
                logicPath: [
                    &quot;목표: 가장 느린 사람(C, D)을 한 번에 같이 보내 시간을 절약해야 함.&quot;,
                    &quot;가장 빠른 사람(A, B)을 손전등 셔틀로 활용.&quot;,
                    &quot;1단계: A와 B가 건너감. (2분 경과)&quot;,
                    &quot;2단계: A가 손전등을 가지고 돌아옴. (총 3분 경과)&quot;,
                    &quot;3단계: 가장 느린 C와 D가 건너감. (총 13분 경과) - 핵심!&quot;,
                    &quot;4단계: 반대편에 있던 B가 손전등을 가지고 돌아옴. (총 15분 경과)&quot;,
                    &quot;5단계: A와 B가 다시 건너감. (총 17분 경과)&quot;,
                    &quot;최적화 완료. 최소 소요 시간은 17분입니다. (AI는 그래프 탐색 알고리즘을 통해 최소 비용 경로를 찾습니다.)&quot;
                ],
                aiExplanation: &quot;이 문제는 AI의 &lt;strong&gt;&#x27;상태 공간 탐색(State Space Search)&#x27; 및 최적화(Optimization) 알고리즘&lt;/strong&gt;을 설명하는 완벽한 예시입니다. AI는 자율주행 자동차의 경로 탐색이나 물류 로봇의 동선 계획을 짤 때, 가능한 모든 이동 경로(노드)를 펼쳐놓고 &#x27;가장 비용(시간)이 적게 드는 최적의 길&#x27;을 찾는 A*(A-star) 알고리즘이나 다익스트라(Dijkstra) 알고리즘을 사용합니다.&quot;
            },
            {
                type: &quot;관계 및 제약 조건 만족&quot;,
                title: &quot;색깔 모자 퀴즈&quot;,
                desc: `세 명의 죄수(가, 나, 다)가 일렬로 서 있습니다. &#x27;다&#x27;는 &#x27;나&#x27;와 &#x27;가&#x27;의 뒷모습을, &#x27;나&#x27;는 &#x27;가&#x27;의 뒷모습만, &#x27;가&#x27;는 아무도 볼 수 없습니다.&lt;br&gt;
                간수는 검은 모자 3개와 흰 모자 2개를 보여준 뒤, 죄수들에게 무작위로 하나씩 씌우고 남은 2개는 숨겼습니다.&lt;br&gt;&lt;br&gt;

                나: (앞의 한 명을 보고) &quot;모르겠습니다.&quot;&lt;br&gt;
                가: (아무도 못 봤지만) **&quot;제 모자는 OOO입니다!&quot;**&lt;br&gt;&lt;br&gt;
                &#x27;가&#x27;의 모자 색깔은 무엇이며, 어떻게 알았을까요?`,
                options: [
                    &quot;흰색 (나와 다가 흰색이어서)&quot;,
                    &quot;검은색 (나와 다가 모르기 때문에)&quot;,
                    &quot;흰색 (검은 모자가 부족해서)&quot;,
                    &quot;알 수 없음 (정보 부족)&quot;
                ],
                correctIndex: 1, // 검은색

            },

                desc: `다음 숫자들의 배열에는 특정한 수학적 규칙이 숨어 있습니다. 규칙을 찾아 빈칸(?)에 들어갈 숫자를 맞혀보세요.&lt;br&gt;&lt;br&gt;

            },
            {

                title: &quot;두 문지기의 딜레마&quot;,
                desc: `당신은 천국과 지옥으로 가는 두 개의 문 앞에 서 있습니다. 각 문 앞에는 문지기가 한 명씩 있습니다.&lt;br&gt;
                - 한 문지기는 항상 진실만 말하고, 다른 문지기는 항상 거짓말만 합니다.&lt;br&gt;

                options: [
                    &quot;\&quot;어느 쪽이 천국으로 가는 문입니까?\&quot;&quot;,

                    &quot;\&quot;다른 문지기에게 천국이 어디냐고 묻는다면, 어느 쪽을 가리키겠습니까?\&quot;&quot;,

                logicPath: [

                    &quot;옵션 1 &amp; 4: 대상이 누구냐에 따라 답이 달라지므로 실패.&quot;,
                    &quot;옵션 2: 정보는 얻을 수 있으나 문을 찾을 기회를 소진함.&quot;,
                    &quot;옵션 3 분석: &#x27;다른 문지기가 가리킬 문&#x27;을 묻는 중첩된 논리.&quot;,
                    &quot;경우 A (진실 문지기에게 질문): 그는 거짓 문지기가 지옥문을 가리킬 것임을 알고 있으므로, 진실하게 **지옥문**을 가리킴.&quot;,
                    &quot;경우 B (거짓 문지기에게 질문): 그는 진실 문지기가 천국문을 가리킬 것임을 알지만, 거짓말을 해야 하므로 반대로 **지옥문**을 가리킴.&quot;,
                    &quot;결론: 누구에게 묻든 돌아오는 대답(가리키는 문)은 **반드시 지옥문**임. 따라서 그 대답의 반대쪽 문으로 들어가면 천국임.&quot;
                ],
                aiExplanation: &quot;이 문제는 컴퓨터 과학의 근간이 되는 &lt;strong&gt;&#x27;논리 게이트(Logic Gate)&#x27;&lt;/strong&gt;와 &lt;strong&gt;&#x27;불 대수(Boolean Algebra)&#x27;&lt;/strong&gt;를 은유적으로 보여줍니다. 여기서 참(True)과 거짓(False)을 곱하는(AND 연산) 중첩된 질문을 던지면, &lt;code&gt;True × False = False&lt;/code&gt;, &lt;code&gt;False × True = False&lt;/code&gt;로 누가 대답하든 항상 일관된 &#x27;거짓(지옥문)&#x27;이라는 결과값을 출력하도록 제어할 수 있습니다. 최근에는 LLM(대형 언어 모델)의 논리적 허점을 파고들어 원하는 대답을 강제하는 &#x27;프롬프트 엔지니어링(Prompt Engineering)&#x27;이나 보안 테스트에도 이와 유사한 역설적 논리 구조가 활용됩니다.&quot;
            }
        ];

        let currentPuzzleIndex = 0;
        let score = 0;
        let isAnswered = false;

        const ui = {
            progressBar: document.getElementById(&#x27;progress-bar&#x27;),
            puzzleBadge: document.getElementById(&#x27;puzzle-badge&#x27;),
            scoreDisplay: document.getElementById(&#x27;score-display&#x27;),
            puzzleContainer: document.getElementById(&#x27;puzzle-container&#x27;),
            puzzleTitle: document.getElementById(&#x27;puzzle-title&#x27;),
            puzzleDesc: document.getElementById(&#x27;puzzle-desc&#x27;),
            optionsContainer: document.getElementById(&#x27;options-container&#x27;),
            feedbackContainer: document.getElementById(&#x27;feedback-container&#x27;),
            feedbackIcon: document.getElementById(&#x27;feedback-icon&#x27;),
            feedbackTitle: document.getElementById(&#x27;feedback-title&#x27;),
            feedbackMessage: document.getElementById(&#x27;feedback-message&#x27;),
            aiLogicPath: document.getElementById(&#x27;ai-logic-path&#x27;),
            aiExplanationContainer: document.getElementById(&#x27;ai-explanation-container&#x27;),
            aiExplanation: document.getElementById(&#x27;ai-explanation&#x27;),
            nextBtn: document.getElementById(&#x27;next-btn&#x27;),
            completionContainer: document.getElementById(&#x27;completion-container&#x27;),
            finalScoreMessage: document.getElementById(&#x27;final-score-message&#x27;)
        };

        function initGame() {
            currentPuzzleIndex = 0;
            score = 0;
            ui.completionContainer.classList.add(&#x27;hidden&#x27;);
            ui.puzzleContainer.classList.remove(&#x27;hidden&#x27;);
            
            // 문제 섞기 (원하면 활성화 - 여기서는 순서대로)
            // puzzles.sort(() =&gt; Math.random() - 0.5); 
            
            updateUI();
            loadPuzzle();
        }

        function updateUI() {
            const progress = (currentPuzzleIndex / puzzles.length) * 100;
            ui.progressBar.style.width = `${progress}%`;
            ui.puzzleBadge.textContent = `추론 과제 ${currentPuzzleIndex + 1} / ${puzzles.length}`;
            ui.scoreDisplay.textContent = `정답: ${score}`;
        }

        function loadPuzzle() {
            isAnswered = false;
            const puzzle = puzzles[currentPuzzleIndex];
            
            ui.puzzleContainer.classList.remove(&#x27;fade-enter&#x27;);
            void ui.puzzleContainer.offsetWidth; // 리플로우 강제 트리거로 애니메이션 재시작
            ui.puzzleContainer.classList.add(&#x27;fade-enter&#x27;);

            ui.puzzleTitle.textContent = puzzle.title;
            ui.puzzleBadge.textContent = `[${puzzle.type}]`;
            ui.puzzleDesc.innerHTML = puzzle.desc;
            
            // 피드백 영역 숨기기
            ui.feedbackContainer.classList.add(&#x27;hidden&#x27;);
            ui.optionsContainer.innerHTML = &#x27;&#x27;;

            // 선택지 버튼 생성
            puzzle.options.forEach((option, index) =&gt; {
                const btn = document.createElement(&#x27;button&#x27;);
                btn.className = &#x27;option-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-blue-400 hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white font-medium text-slate-700&#x27;;
                btn.innerHTML = `&lt;span class=&quot;inline-block w-6 h-6 rounded-full bg-slate-100 text-slate-500 text-center leading-6 mr-3 text-sm&quot;&gt;${index + 1}&lt;/span&gt;${option}`;
                
                btn.onclick = () =&gt; selectOption(index, btn);
                ui.optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, selectedBtn) {
            if (isAnswered) return; // 이미 답변했으면 무시
            isAnswered = true;

            const puzzle = puzzles[currentPuzzleIndex];
            const isCorrect = selectedIndex === puzzle.correctIndex;
            const allBtns = ui.optionsContainer.querySelectorAll(&#x27;button&#x27;);

            // 버튼 상태 업데이트
            allBtns.forEach((btn, idx) =&gt; {
                btn.disabled = true;
                btn.classList.remove(&#x27;hover:border-blue-400&#x27;, &#x27;hover:bg-blue-50&#x27;, &#x27;cursor-pointer&#x27;);
                
                if (idx === puzzle.correctIndex) {
                    btn.classList.add(&#x27;correct-bg&#x27;);
                } else if (idx === selectedIndex &amp;&amp; !isCorrect) {
                    btn.classList.add(&#x27;wrong-bg&#x27;);
                    btn.classList.add(&#x27;shake&#x27;); // 오답 시 흔들림 애니메이션
                } else {
                    btn.style.opacity = &#x27;0.5&#x27;;
                }
            });

            if (isCorrect) {
                score++;
                ui.scoreDisplay.textContent = `정답: ${score}`;
            }

            showFeedback(isCorrect, puzzle);
        }

        function showFeedback(isCorrect, puzzle) {
            ui.feedbackContainer.classList.remove(&#x27;hidden&#x27;);
            ui.feedbackContainer.className = `mt-6 p-5 rounded-xl border fade-enter ${isCorrect ? &#x27;bg-green-50 border-green-200 text-green-900&#x27; : &#x27;bg-red-50 border-red-200 text-red-900&#x27;}`;
            
            ui.feedbackIcon.textContent = isCorrect ? &#x27;✅&#x27; : &#x27;❌&#x27;;
            ui.feedbackTitle.textContent = isCorrect ? &#x27;정확한 추론입니다!&#x27; : &#x27;논리적 오류가 발생했습니다.&#x27;;
            
            let message = isCorrect 
                ? &quot;제시된 정보들을 바탕으로 올바른 결론을 도출하셨습니다. 아래는 AI가 동일한 문제를 풀 때 거치는 논리적 단계입니다.&quot; 
                : `선택하신 답은 정답이 아닙니다. 정답은 &lt;strong&gt;&#x27;${puzzle.options[puzzle.correctIndex]}&#x27;&lt;/strong&gt;입니다. AI가 어떻게 이 결론에 도달하는지 아래 추론 과정을 확인해 보세요.`;
            
            ui.feedbackMessage.innerHTML = message;

            // AI 생각의 사슬 렌더링
            ui.aiLogicPath.innerHTML = &#x27;&#x27;;
            
            // 설명 컨테이너 초기화 및 숨기기
            ui.aiExplanationContainer.classList.add(&#x27;hidden&#x27;);
            ui.aiExplanationContainer.classList.remove(&#x27;opacity-100&#x27;);
            ui.aiExplanationContainer.classList.add(&#x27;opacity-0&#x27;);
            ui.aiExplanation.innerHTML = puzzle.aiExplanation;

            // 약간의 딜레이를 주어 한 줄씩 렌더링하는 효과 (타이핑 효과)
            puzzle.logicPath.forEach((step, index) =&gt; {
                const li = document.createElement(&#x27;li&#x27;);
                li.innerHTML = step;
                li.style.opacity = &#x27;0&#x27;;
                li.style.transform = &#x27;translateX(-10px)&#x27;;
                li.style.transition = &#x27;all 0.3s ease&#x27;;
                ui.aiLogicPath.appendChild(li);

                setTimeout(() =&gt; {
                    li.style.opacity = &#x27;1&#x27;;
                    li.style.transform = &#x27;translateX(0)&#x27;;
                }, index * 200 + 100); // 0.2초 간격으로 나타남
            });

            // 논리 경로 애니메이션이 끝난 후 AI 관련성 설명 보여주기
            const totalDelay = puzzle.logicPath.length * 200 + 400;
            setTimeout(() =&gt; {
                ui.aiExplanationContainer.classList.remove(&#x27;hidden&#x27;);
                // 약간의 딜레이 후 opacity 변경으로 페이드인 효과
                setTimeout(() =&gt; {
                    ui.aiExplanationContainer.classList.remove(&#x27;opacity-0&#x27;);
                    ui.aiExplanationContainer.classList.add(&#x27;opacity-100&#x27;);
                }, 50);
            }, totalDelay);

            // 마지막 문제인 경우 버튼 텍스트 변경
            if (currentPuzzleIndex === puzzles.length - 1) {
                ui.nextBtn.textContent = &#x27;결과 확인하기&#x27;;
                ui.nextBtn.classList.remove(&#x27;bg-slate-800&#x27;, &#x27;hover:bg-slate-700&#x27;);
                ui.nextBtn.classList.add(&#x27;bg-blue-600&#x27;, &#x27;hover:bg-blue-700&#x27;);
            } else {
                ui.nextBtn.textContent = &#x27;다음 추론으로&#x27;;
            }
        }

        ui.nextBtn.onclick = () =&gt; {
            if (currentPuzzleIndex &lt; puzzles.length - 1) {
                currentPuzzleIndex++;
                updateUI();
                loadPuzzle();
            } else {
                showCompletion();
            }
        };

        function showCompletion() {
            ui.progressBar.style.width = &#x27;100%&#x27;;
            ui.puzzleContainer.classList.add(&#x27;hidden&#x27;);
            ui.feedbackContainer.classList.add(&#x27;hidden&#x27;);
            ui.completionContainer.classList.remove(&#x27;hidden&#x27;);
            ui.completionContainer.classList.add(&#x27;fade-enter&#x27;);

            let evalText = &quot;&quot;;
            if (score === puzzles.length) {
                evalText = &quot;완벽합니다! AI 수준의 논리력(또는 그 이상)을 갖추셨군요. 복잡한 알고리즘을 설계하는 데 소질이 있습니다.&quot;;
            } else if (score &gt;= 3) {
                evalText = &quot;훌륭합니다! 꽤 날카로운 논리적 직관을 가지고 계십니다. 일부 함정만 조심하면 완벽합니다.&quot;;
            } else {
                evalText = &quot;나쁘지 않은 시도입니다. 논리적 추론은 근육과 같아서 훈련할수록 발달합니다. AI의 &#x27;생각의 사슬&#x27; 과정을 참고하여 다시 도전해 보세요.&quot;;
            }

            ui.finalScoreMessage.innerHTML = `총 ${puzzles.length}개의 논리 과제 중 &lt;strong&gt;${score}개&lt;/strong&gt;를 해결하셨습니다.&lt;br&gt;&lt;br&gt;${evalText}`;
        }

        // 초기화 실행
        window.onload = initGame;

    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;" title="AI 논리 추론 시뮬레이터"></iframe>
  </div>
</section>

                            사람이 눈앞의 단서를 종합하여 답을 도출하는 과정은 인공지능이 &lt;strong&gt;제약 조건을 해결하고 최적의 솔루션을 찾는 알고리즘&lt;/strong&gt;과 일치합니다.

                                &lt;i class=&quot;fa-solid fa-diagram-project text-sm&quot;&gt;&lt;/i&gt; 1. 제약 충족 문제 (CSP)
                            &lt;/div&gt;
                            &lt;h5 class=&quot;font-bold text-white text-sm&quot;&gt;Constraint Satisfaction Problem&lt;/h5&gt;
                            &lt;p class=&quot;text-slate-400 text-xs&quot;&gt;
                                AI는 복잡한 문제를 &lt;strong&gt;변수(Variables)&lt;/strong&gt;, 각 변수가 가질 수 있는 &lt;strong&gt;값의 영역(Domain)&lt;/strong&gt;, 변수 간의 &lt;strong&gt;제약 조건(Constraints)&lt;/strong&gt;으로 정의합니다.
                            &lt;/p&gt;
                            &lt;ul class=&quot;list-disc list-inside text-[11px] text-slate-300 space-y-1 bg-slate-900/80 p-2.5 rounded-xl border border-slate-800&quot;&gt;
                                &lt;li&gt;&lt;strong&gt;변수:&lt;/strong&gt; 5개의 집(1~5번) 및 속성(국적, 색상, 음료 등)&lt;/li&gt;
                                &lt;li&gt;&lt;strong&gt;제약조건:&lt;/strong&gt; &quot;노르웨이인은 1번 집&quot;, &quot;초록 집은 하얀 집의 왼쪽&quot;&lt;/li&gt;
                                &lt;li&gt;&lt;strong&gt;알고리즘:&lt;/strong&gt; 백트래킹(Backtracking)과 호 호환성(Arc Consistency AC-3)을 이용해 불가능한 후보를 사전 제거.&lt;/li&gt;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let audioMuted = false;

        function playTone(freq, type, duration) {
            if (audioMuted) return;
            try {
                if (audioCtx.state === &#x27;suspended&#x27;) {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

                        &lt;i class=&quot;fa-solid fa-code-branch text-slate-600 text-xl mb-1 block&quot;&gt;&lt;/i&gt;
                        &lt;p class=&quot;text-xs text-slate-400 font-semibold&quot;&gt;아직 도출된 IF ~ THEN 논리 추론이 없습니다.&lt;/p&gt;
                        &lt;p class=&quot;text-[11px] text-slate-600 mt-0.5&quot;&gt;단서 조건이 해결되거나 집 배치를 변경하면 이곳에 실시간 추론 과정이 기록됩니다.&lt;/p&gt;
                    &lt;/div&gt;
                `;
                return;
            }

            container.innerHTML = &#x27;&#x27;;
            ifThenLogs.forEach((log, index) =&gt; {
                const card = document.createElement(&#x27;div&#x27;);
                const isLatest = (index === 0);
                const borderStyle = isLatest 
                    ? &quot;border-emerald-500/50 bg-slate-950/90 shadow-md animate-pulse-highlight&quot; 
                    : &quot;border-slate-800/80 bg-slate-950/60 opacity-90 hover:border-slate-700&quot;;

                card.className = `p-2.5 rounded-xl border transition space-y-1 text-xs ${borderStyle}`;

                card.innerHTML = `
                    &lt;div class=&quot;flex items-center justify-between text-[10px]&quot;&gt;
                        &lt;span class=&quot;px-2 py-0.5 rounded font-bold uppercase tracking-wider bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 flex items-center gap-1&quot;&gt;
                            &lt;i class=&quot;fa-solid fa-lightbulb&quot;&gt;&lt;/i&gt; 추론 #${ifThenLogs.length - index} (${log.tag})
                        &lt;/span&gt;
                        &lt;span class=&quot;text-slate-500 font-mono&quot;&gt;${log.timestamp}&lt;/span&gt;
                    &lt;/div&gt;

                    &lt;div class=&quot;grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1&quot;&gt;
                        &lt;!-- IF Box --&gt;
                        &lt;div class=&quot;bg-amber-500/10 border border-amber-500/20 p-2 rounded-lg flex items-start gap-1.5 flex-col&quot;&gt;
                            &lt;span class=&quot;px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 font-black text-[10px] tracking-wider uppercase whitespace-nowrap self-start&quot;&gt;IF (단서 교차 검증)&lt;/span&gt;
                            &lt;div class=&quot;text-amber-100 font-medium text-[11px] leading-snug w-full pl-1 border-l-2 border-amber-500/50 mt-1 space-y-1&quot;&gt;
                                ${log.premiseHtml}
                            &lt;/div&gt;
                        &lt;/div&gt;

                        &lt;!-- THEN Box --&gt;
                        &lt;div class=&quot;bg-emerald-500/10 border border-emerald-500/20 p-2 rounded-lg flex items-start gap-1.5 flex-col&quot;&gt;
                            &lt;span class=&quot;px-1.5 py-0.5 rounded bg-emerald-500/30 text-emerald-300 font-black text-[10px] tracking-wider uppercase whitespace-nowrap self-start&quot;&gt;THEN (새롭게 생성된 사실)&lt;/span&gt;
                            &lt;div class=&quot;text-emerald-100 font-extrabold text-[11px] leading-snug w-full pl-1 border-l-2 border-emerald-500/50 mt-1&quot;&gt;
                                ${log.conclusionHtml}
                            &lt;/div&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                `;

                container.appendChild(card);
            });
        }

        // 제약조건 검사: 특정 집에 아이템 배치 시 어떤 단서와 충돌하는지 이유를 반환 (강화된 교차검증)
        function getViolationReason(hNum, catId, itemVal, factsMap) {
            const findItemHouse = (cId, iVal) =&gt; {
                for (let i = 1; i &lt;= currentConfig.houseCount; i++) {
                    if (factsMap[`${i}_${cId}`] === iVal) return i;
                }
                return null;
            };

            for (let clue of currentConfig.clues) {
                // 단서 텍스트의 앞부분(번호 등)을 가져오기 위한 정규식 처리
                const cluePrefixMatch = clue.text.match(/^(\d+\.)/);
                const cluePrefix = cluePrefixMatch ? cluePrefixMatch[1] : &quot;단서&quot;;

                if (clue.type === &#x27;fixed&#x27;) {
                    if (clue.cat === catId) {
                        if (clue.val === itemVal &amp;&amp; clue.house !== hNum) return `[${cluePrefix} 충돌] 다른 집(House ${clue.house})에 고정됨`;
                        if (clue.val !== itemVal &amp;&amp; clue.house === hNum) return `[${cluePrefix} 충돌] 이 집은 &#x27;${clue.val}&#x27; 전용`;
                    }
                } else if (clue.type === &#x27;same&#x27;) {
                    if (clue.a.cat === catId &amp;&amp; clue.a.val === itemVal) {
                        const bVal = factsMap[`${hNum}_${clue.b.cat}`];
                        if (bVal &amp;&amp; bVal !== clue.b.val) return `[${cluePrefix} 충돌] 짝궁(&#x27;${clue.b.val}&#x27;)이 현재 집에 들어갈 수 없음 (현재 &#x27;${bVal}&#x27;)`;
                        const bLoc = findItemHouse(clue.b.cat, clue.b.val);
                        if (bLoc &amp;&amp; bLoc !== hNum) return `[${cluePrefix} 충돌] 짝궁(&#x27;${clue.b.val}&#x27;)이 이미 다른 집(House ${bLoc})에 있음`;
                    }
                    if (clue.b.cat === catId &amp;&amp; clue.b.val === itemVal) {
                        const aVal = factsMap[`${hNum}_${clue.a.cat}`];
                        if (aVal &amp;&amp; aVal !== clue.a.val) return `[${cluePrefix} 충돌] 짝궁(&#x27;${clue.a.val}&#x27;)이 현재 집에 들어갈 수 없음 (현재 &#x27;${aVal}&#x27;)`;
                        const aLoc = findItemHouse(clue.a.cat, clue.a.val);
                        if (aLoc &amp;&amp; aLoc !== hNum) return `[${cluePrefix} 충돌] 짝궁(&#x27;${clue.a.val}&#x27;)이 이미 다른 집(House ${aLoc})에 있음`;
                    }
                } else if (clue.type === &#x27;left_of&#x27;) {
                    if (clue.left.cat === catId &amp;&amp; clue.left.val === itemVal) {
                        if (hNum === currentConfig.houseCount) return `[${cluePrefix} 충돌] 오른쪽에 집이 없음`;
                        const rightVal = factsMap[`${hNum + 1}_${clue.right.cat}`];
                        if (rightVal &amp;&amp; rightVal !== clue.right.val) return `[${cluePrefix} 충돌] 오른쪽 집이 &#x27;${rightVal}&#x27;임 (&#x27;${clue.right.val}&#x27;이어야 함)`;
                        const rightLoc = findItemHouse(clue.right.cat, clue.right.val);
                        if (rightLoc &amp;&amp; rightLoc !== hNum + 1) return `[${cluePrefix} 충돌] 오른쪽 짝궁(&#x27;${clue.right.val}&#x27;)이 이미 다른 집(House ${rightLoc})에 있음`;
                    }
                    if (clue.right.cat === catId &amp;&amp; clue.right.val === itemVal) {
                        if (hNum === 1) return `[${cluePrefix} 충돌] 왼쪽에 집이 없음`;
                        const leftVal = factsMap[`${hNum - 1}_${clue.left.cat}`];
                        if (leftVal &amp;&amp; leftVal !== clue.left.val) return `[${cluePrefix} 충돌] 왼쪽 집이 &#x27;${leftVal}&#x27;임 (&#x27;${clue.left.val}&#x27;이어야 함)`;
                        const leftLoc = findItemHouse(clue.left.cat, clue.left.val);
                        if (leftLoc &amp;&amp; leftLoc !== hNum - 1) return `[${cluePrefix} 충돌] 왼쪽 짝궁(&#x27;${clue.left.val}&#x27;)이 이미 다른 집(House ${leftLoc})에 있음`;
                    }
                } else if (clue.type === &#x27;neighbor&#x27;) {
                    if (clue.a.cat === catId &amp;&amp; clue.a.val === itemVal) {
                        let leftPossible = false;
                        let rightPossible = false;
                        const bLoc = findItemHouse(clue.b.cat, clue.b.val);
                        if (hNum &gt; 1) {
                            const leftVal = factsMap[`${hNum - 1}_${clue.b.cat}`];
                            if ((!leftVal || leftVal === clue.b.val) &amp;&amp; (!bLoc || bLoc === hNum - 1)) leftPossible = true;
                        }
                        if (hNum &lt; currentConfig.houseCount) {
                            const rightVal = factsMap[`${hNum + 1}_${clue.b.cat}`];
                            if ((!rightVal || rightVal === clue.b.val) &amp;&amp; (!bLoc || bLoc === hNum + 1)) rightPossible = true;
                        }
                        if (!leftPossible &amp;&amp; !rightPossible) return `[${cluePrefix} 충돌] 양옆 어느 곳에도 &#x27;${clue.b.val}&#x27; 배치 불가`;
                    }
                    if (clue.b.cat === catId &amp;&amp; clue.b.val === itemVal) {
                        let leftPossible = false;
                        let rightPossible = false;
                        const aLoc = findItemHouse(clue.a.cat, clue.a.val);
                        if (hNum &gt; 1) {
                            const leftVal = factsMap[`${hNum - 1}_${clue.a.cat}`];
                            if ((!leftVal || leftVal === clue.a.val) &amp;&amp; (!aLoc || aLoc === hNum - 1)) leftPossible = true;
                        }
                        if (hNum &lt; currentConfig.houseCount) {
                            const rightVal = factsMap[`${hNum + 1}_${clue.a.cat}`];
                            if ((!rightVal || rightVal === clue.a.val) &amp;&amp; (!aLoc || aLoc === hNum + 1)) rightPossible = true;
                        }
                        if (!leftPossible &amp;&amp; !rightPossible) return `[${cluePrefix} 충돌] 양옆 어느 곳에도 &#x27;${clue.a.val}&#x27; 배치 불가`;
                    }
                }
            }
            return null;
        }

        function runRuleInferenceEngine() {
            derivedFactsList = [];
            let currentFactsMap = {}; 
            boardState.forEach((h, hIdx) =&gt; {
                currentConfig.categories.forEach(cat =&gt; {
                    if (h[cat.id]) {
                        currentFactsMap[`${hIdx + 1}_${cat.id}`] = h[cat.id];
                    }
                });
            });

            let inferredSet = new Set();
            let passes = 0;
            let newlyDerivedInPass = true;

            while (newlyDerivedInPass &amp;&amp; passes &lt; 15) {
                newlyDerivedInPass = false;
                passes++;

                // 1. 직접 규칙 도출 (Fixed, Same, Left-of, Neighbor)
                currentConfig.clues.forEach((clue, idx) =&gt; {
                    if (clue.type === &#x27;fixed&#x27;) {
                        const key = `${clue.house}_${clue.cat}`;
                        if (!currentFactsMap[key]) {
                            const factObj = {
                                id: `fact_fixed_${clue.house}_${clue.cat}`,
                                house: clue.house,
                                cat: clue.cat,
                                val: clue.val,
                                ruleName: &#x27;고정 위치 규칙&#x27;,
                                premiseHtml: `&lt;div&gt;[단서 ${idx + 1}] &quot;${clue.text}&quot;&lt;/div&gt;`,
                                factText: `House ${clue.house}의 ${getCategoryName(clue.cat)}은(는) [${clue.val}] 입니다.`
                            };
                            currentFactsMap[key] = clue.val;
                            if (!inferredSet.has(factObj.id)) {
                                inferredSet.add(factObj.id);
                                derivedFactsList.push(factObj);
                                newlyDerivedInPass = true;
                            }
                        }
                    } else if (clue.type === &#x27;same&#x27;) {
                        for (let hNum = 1; hNum &lt;= currentConfig.houseCount; hNum++) {
                            const keyA = `${hNum}_${clue.a.cat}`;
                            const keyB = `${hNum}_${clue.b.cat}`;

                            if (currentFactsMap[keyA] === clue.a.val &amp;&amp; !currentFactsMap[keyB]) {
                                const factObj = {
                                    id: `fact_same_${hNum}_${clue.b.cat}`,
                                    house: hNum,
                                    cat: clue.b.cat,
                                    val: clue.b.val,
                                    ruleName: &#x27;동일 위치 귀속 규칙&#x27;,
                                    premiseHtml: `
                                        &lt;div&gt;&lt;span class=&quot;text-slate-400&quot;&gt;기존 사실:&lt;/span&gt; House ${hNum} = ${clue.a.val}&lt;/div&gt;
                                        &lt;div&gt;&lt;span class=&quot;text-slate-400&quot;&gt;단서 ${idx + 1}:&lt;/span&gt; &quot;${clue.text}&quot;&lt;/div&gt;
                                    `,
                                    factText: `House ${hNum}의 ${getCategoryName(clue.b.cat)}은(는) [${clue.b.val}] 입니다.`
                                };
                                currentFactsMap[keyB] = clue.b.val;
                                if (!inferredSet.has(factObj.id)) {
                                    inferredSet.add(factObj.id);
                                    derivedFactsList.push(factObj);
                                    newlyDerivedInPass = true;
                                }
                            } else if (currentFactsMap[keyB] === clue.b.val &amp;&amp; !currentFactsMap[keyA]) {
                                const factObj = {
                                    id: `fact_same_${hNum}_${clue.a.cat}`,
                                    house: hNum,
                                    cat: clue.a.cat,
                                    val: clue.a.val,
                                    ruleName: &#x27;동일 위치 귀속 규칙&#x27;,
                                    premiseHtml: `
                                        &lt;div&gt;&lt;span class=&quot;text-slate-400&quot;&gt;기존 사실:&lt;/span&gt; House ${hNum} = ${clue.b.val}&lt;/div&gt;
                                        &lt;div&gt;&lt;span class=&quot;text-slate-400&quot;&gt;단서 ${idx + 1}:&lt;/span&gt; &quot;${clue.text}&quot;&lt;/div&gt;
                                    `,
                                    factText: `House ${hNum}의 ${getCategoryName(clue.a.cat)}은(는) [${clue.a.val}] 입니다.`
                                };
                                currentFactsMap[keyA] = clue.a.val;
                                if (!inferredSet.has(factObj.id)) {
                                    inferredSet.add(factObj.id);
                                    derivedFactsList.push(factObj);
                                    newlyDerivedInPass = true;
                                }
                            }
                        }
                    }
                    // Left_of and Neighbor basic forward chaining...
                    else if (clue.type === &#x27;left_of&#x27;) {
                        for (let hNum = 1; hNum &lt;= currentConfig.houseCount; hNum++) {
                            const keyLeft = `${hNum}_${clue.left.cat}`;
                            const keyRight = `${hNum + 1}_${clue.right.cat}`;

                            if (currentFactsMap[keyLeft] === clue.left.val &amp;&amp; hNum + 1 &lt;= currentConfig.houseCount &amp;&amp; !currentFactsMap[keyRight]) {
                                const factObj = {
                                    id: `fact_left_${hNum + 1}_${clue.right.cat}`,
                                    house: hNum + 1,
                                    cat: clue.right.cat,
                                    val: clue.right.val,
                                    ruleName: &#x27;좌측 인접 위치 규칙&#x27;,
                                    premiseHtml: `
                                        &lt;div&gt;&lt;span class=&quot;text-slate-400&quot;&gt;기존 사실:&lt;/span&gt; House ${hNum} = ${clue.left.val}&lt;/div&gt;
                                        &lt;div&gt;&lt;span class=&quot;text-slate-400&quot;&gt;단서 ${idx + 1}:&lt;/span&gt; &quot;${clue.text}&quot;&lt;/div&gt;
                                    `,
                                    factText: `House ${hNum + 1}의 ${getCategoryName(clue.right.cat)}은(는) [${clue.right.val}] 입니다.`
                                };
                                currentFactsMap[keyRight] = clue.right.val;
                                if (!inferredSet.has(factObj.id)) {
                                    inferredSet.add(factObj.id);
                                    derivedFactsList.push(factObj);
                                    newlyDerivedInPass = true;
                                }
                            } else if (currentFactsMap[keyRight] === clue.right.val &amp;&amp; hNum - 1 &gt;= 1) {
                                const keyLPrev = `${hNum - 1}_${clue.left.cat}`;
                                if (!currentFactsMap[keyLPrev]) {
                                    const factObj = {
                                        id: `fact_left_${hNum - 1}_${clue.left.cat}`,
                                        house: hNum - 1,
                                        cat: clue.left.cat,
                                        val: clue.left.val,
                                        ruleName: &#x27;우측 인접 역추론 규칙&#x27;,
                                        premiseHtml: `
                                            &lt;div&gt;&lt;span class=&quot;text-slate-400&quot;&gt;기존 사실:&lt;/span&gt; House ${hNum} = ${clue.right.val}&lt;/div&gt;
                                            &lt;div&gt;&lt;span class=&quot;text-slate-400&quot;&gt;단서 ${idx + 1}:&lt;/span&gt; &quot;${clue.text}&quot;&lt;/div&gt;
                                        `,
                                        factText: `House ${hNum - 1}의 ${getCategoryName(clue.left.cat)}은(는) [${clue.left.val}] 입니다.`
                                    };
                                    currentFactsMap[keyLPrev] = clue.left.val;
                                    if (!inferredSet.has(factObj.id)) {
                                        inferredSet.add(factObj.id);
                                        derivedFactsList.push(factObj);
                                        newlyDerivedInPass = true;
                                    }
                                }
                            }
                        }
                    } else if (clue.type === &#x27;neighbor&#x27;) {
                        for (let hNum = 1; hNum &lt;= currentConfig.houseCount; hNum++) {
                            const keyA = `${hNum}_${clue.a.cat}`;
                            if (currentFactsMap[keyA] === clue.a.val) {
                                const leftH = hNum - 1;
                                const rightH = hNum + 1;

                                if (leftH &lt; 1 &amp;&amp; rightH &lt;= currentConfig.houseCount) {
                                    const keyB = `${rightH}_${clue.b.cat}`;
                                    if (!currentFactsMap[keyB]) {
                                        const factObj = {
                                            id: `fact_neigh_${rightH}_${clue.b.cat}`,
                                            house: rightH,
                                            cat: clue.b.cat,
                                            val: clue.b.val,
                                            ruleName: &#x27;경계 인접 유일 규칙&#x27;,
                                            premiseHtml: `
                                                &lt;div&gt;&lt;span class=&quot;text-slate-400&quot;&gt;기존 사실:&lt;/span&gt; House 1 = ${clue.a.val} &lt;span class=&quot;text-[10px] text-amber-500/80&quot;&gt;(왼쪽 이웃 없음)&lt;/span&gt;&lt;/div&gt;
                                                &lt;div&gt;&lt;span class=&quot;text-slate-400&quot;&gt;단서 ${idx + 1}:&lt;/span&gt; &quot;${clue.text}&quot;&lt;/div&gt;
                                            `,
                                            factText: `House ${rightH}의 ${getCategoryName(clue.b.cat)}은(는) [${clue.b.val}] 입니다.`
                                        };
                                        currentFactsMap[keyB] = clue.b.val;
                                        if (!inferredSet.has(factObj.id)) {
                                            inferredSet.add(factObj.id);
                                            derivedFactsList.push(factObj);
                                            newlyDerivedInPass = true;
                                        }
                                    }
                                } else if (rightH &gt; currentConfig.houseCount &amp;&amp; leftH &gt;= 1) {
                                    const keyB = `${leftH}_${clue.b.cat}`;
                                    if (!currentFactsMap[keyB]) {
                                        const factObj = {
                                            id: `fact_neigh_${leftH}_${clue.b.cat}`,
                                            house: leftH,
                                            cat: clue.b.cat,
                                            val: clue.b.val,
                                            ruleName: &#x27;경계 인접 유일 규칙&#x27;,
                                            premiseHtml: `
                                                &lt;div&gt;&lt;span class=&quot;text-slate-400&quot;&gt;기존 사실:&lt;/span&gt; House ${currentConfig.houseCount} = ${clue.a.val} &lt;span class=&quot;text-[10px] text-amber-500/80&quot;&gt;(오른쪽 이웃 없음)&lt;/span&gt;&lt;/div&gt;
                                                &lt;div&gt;&lt;span class=&quot;text-slate-400&quot;&gt;단서 ${idx + 1}:&lt;/span&gt; &quot;${clue.text}&quot;&lt;/div&gt;
                                            `,
                                            factText: `House ${leftH}의 ${getCategoryName(clue.b.cat)}은(는) [${clue.b.val}] 입니다.`
                                        };
                                        currentFactsMap[keyB] = clue.b.val;
                                        if (!inferredSet.has(factObj.id)) {
                                            inferredSet.add(factObj.id);
                                            derivedFactsList.push(factObj);
                                            newlyDerivedInPass = true;
                                        }
                                    }
                                }
                            }
                        }
                    }
                });

                // 2. 나무위키식 스마트 교차검증 (항목 기준 소거법: 특정 항목이 특정 집에만 들어갈 수 있는지)
                currentConfig.categories.forEach(cat =&gt; {
                    const allItems = currentConfig.items[cat.id];
                    allItems.forEach(item =&gt; {
                        let alreadyPlaced = false;
                        for (let i = 0; i &lt; currentConfig.houseCount; i++) {
                            if (currentFactsMap[`${i + 1}_${cat.id}`] === item.name) {
                                alreadyPlaced = true;
                                break;
                            }
                        }
                        if (alreadyPlaced) return;

                        let validHouses = [];
                        let eliminationReasons = {};

                        for (let hNum = 1; hNum &lt;= currentConfig.houseCount; hNum++) {
                            if (currentFactsMap[`${hNum}_${cat.id}`] &amp;&amp; currentFactsMap[`${hNum}_${cat.id}`] !== item.name) {
                                eliminationReasons[hNum] = `이미 다른 ${cat.name}(${currentFactsMap[`${hNum}_${cat.id}`]}) 배치됨`;
                                continue;
                            }

                            const violation = getViolationReason(hNum, cat.id, item.name, currentFactsMap);
                            if (violation) {
                                eliminationReasons[hNum] = violation;
                            } else {
                                validHouses.push(hNum);
                            }
                        }

                        if (validHouses.length === 1) {
                            const targetH = validHouses[0];
                            const factId = `fact_smart_elim_item_${targetH}_${cat.id}_${item.name}`;
                            
                            if (!inferredSet.has(factId)) {
                                let premiseHtml = `&lt;div class=&quot;mb-1&quot;&gt;&lt;span class=&quot;text-amber-300 font-bold&quot;&gt;항목 기준 소거:&lt;/span&gt; &#x27;&lt;span class=&quot;text-white&quot;&gt;${item.name}&lt;/span&gt;&#x27;의 배치를 다른 집들에 가정한 결과 모두 단서 모순:&lt;/div&gt;`;
                                premiseHtml += `&lt;ul class=&quot;list-disc list-inside space-y-0.5 text-[10px] ml-1 mb-1&quot;&gt;`;
                                for(let h = 1; h &lt;= currentConfig.houseCount; h++) {
                                    if (h !== targetH) {
                                        premiseHtml += `&lt;li&gt;House ${h} 불가: &lt;span class=&quot;text-slate-400&quot;&gt;${eliminationReasons[h]}&lt;/span&gt;&lt;/li&gt;`;
                                    }
                                }
                                premiseHtml += `&lt;/ul&gt;`;
                                premiseHtml += `&lt;div class=&quot;text-[11px] font-bold text-emerald-400 border-t border-amber-500/30 pt-1 mt-1&quot;&gt;&lt;i class=&quot;fa-solid fa-arrow-turn-down fa-rotate-270 mr-1.5&quot;&gt;&lt;/i&gt; 유일하게 남은 위치는 House ${targetH}뿐입니다.&lt;/div&gt;`;

                                const factObj = {
                                    id: factId,
                                    house: targetH,
                                    cat: cat.id,
                                    val: item.name,
                                    ruleName: &#x27;항목 기준 유일 자리 소거법&#x27;,
                                    premiseHtml: premiseHtml,
                                    factText: `House ${targetH}의 ${cat.name}은(는) [${item.name}] 입니다.`
                                };
                                currentFactsMap[`${targetH}_${cat.id}`] = item.name;
                                inferredSet.add(factId);
                                derivedFactsList.push(factObj);
                                newlyDerivedInPass = true;
                            }
                        }
                    });
                });

                // 3. 나무위키식 스마트 교차검증 (슬롯 기준 소거법: 특정 집 슬롯에 들어갈 수 있는 남은 항목이 단 1개인지)
                for (let hNum = 1; hNum &lt;= currentConfig.houseCount; hNum++) {
                    currentConfig.categories.forEach(cat =&gt; {
                        if (currentFactsMap[`${hNum}_${cat.id}`]) return; // 이미 채워진 슬롯 패스

                        let validItems = [];
                        let eliminationReasons = {};

                        const allItems = currentConfig.items[cat.id];
                        const usedItems = Object.keys(currentFactsMap)
                            .filter(k =&gt; k.endsWith(`_${cat.id}`))
                            .map(k =&gt; currentFactsMap[k]);
                        
                        const unusedItems = allItems.filter(i =&gt; !usedItems.includes(i.name));

                        unusedItems.forEach(item =&gt; {
                            const violation = getViolationReason(hNum, cat.id, item.name, currentFactsMap);
                            if (violation) {
                                eliminationReasons[item.name] = violation;
                            } else {
                                validItems.push(item.name);
                            }
                        });

                        if (validItems.length === 1) {
                            const targetItem = validItems[0];
                            const factId = `fact_smart_elim_slot_${hNum}_${cat.id}_${targetItem}`;
                            
                            if (!inferredSet.has(factId)) {
                                let premiseHtml = `&lt;div class=&quot;mb-1&quot;&gt;&lt;span class=&quot;text-amber-300 font-bold&quot;&gt;슬롯 기준 소거:&lt;/span&gt; House ${hNum}의 &lt;span class=&quot;text-white&quot;&gt;${cat.name}&lt;/span&gt; 자리에 남은 후보들을 넣어본 결과 단서 모순 발생:&lt;/div&gt;`;
                                premiseHtml += `&lt;ul class=&quot;list-disc list-inside space-y-0.5 text-[10px] ml-1 mb-1&quot;&gt;`;
                                unusedItems.forEach(item =&gt; {
                                    if (item.name !== targetItem) {
                                        premiseHtml += `&lt;li&gt;&lt;span class=&quot;text-rose-300&quot;&gt;${item.name}&lt;/span&gt; 불가: &lt;span class=&quot;text-slate-400&quot;&gt;${eliminationReasons[item.name]}&lt;/span&gt;&lt;/li&gt;`;
                                    }
                                });
                                premiseHtml += `&lt;/ul&gt;`;
                                premiseHtml += `&lt;div class=&quot;text-[11px] font-bold text-emerald-400 border-t border-amber-500/30 pt-1 mt-1&quot;&gt;&lt;i class=&quot;fa-solid fa-arrow-turn-down fa-rotate-270 mr-1.5&quot;&gt;&lt;/i&gt; 유일하게 남은 후보는 [${targetItem}]뿐입니다.&lt;/div&gt;`;

                                const factObj = {
                                    id: factId,
                                    house: hNum,
                                    cat: cat.id,
                                    val: targetItem,
                                    ruleName: &#x27;슬롯 기준 유일 후보 소거법&#x27;,
                                    premiseHtml: premiseHtml,
                                    factText: `House ${hNum}의 ${cat.name}은(는) [${targetItem}] 입니다.`
                                };
                                currentFactsMap[`${hNum}_${cat.id}`] = targetItem;
                                inferredSet.add(factId);
                                derivedFactsList.push(factObj);
                                newlyDerivedInPass = true;
                            }
                        }
                    });
                }
            }

            renderDerivedFacts();
        }

        function getCategoryName(catId) {
            const cat = currentConfig.categories.find(c =&gt; c.id === catId);
            return cat ? cat.name : catId;
        }

        function renderDerivedFacts() {
            const feedEl = document.getElementById(&#x27;panel-content-rules&#x27;);
            const badgeEl = document.getElementById(&#x27;derived-facts-count-badge&#x27;);
            if (!feedEl) return;

            feedEl.innerHTML = &#x27;&#x27;;

            const newUnappliedFacts = derivedFactsList.filter(f =&gt; boardState[f.house - 1][f.cat] !== f.val);

            if (newUnappliedFacts.length &gt; 0) {
                badgeEl.innerText = newUnappliedFacts.length;
                badgeEl.classList.remove(&#x27;hidden&#x27;);
            } else {
                badgeEl.classList.add(&#x27;hidden&#x27;);
            }

            if (derivedFactsList.length === 0) {
                feedEl.innerHTML = `
                    &lt;div class=&quot;text-center py-10 px-4 text-slate-500 space-y-2&quot;&gt;
                        &lt;i class=&quot;fa-solid fa-diagram-project text-3xl text-slate-700&quot;&gt;&lt;/i&gt;
                        &lt;p class=&quot;text-xs font-semibold text-slate-400&quot;&gt;현재 확정된 사실로 생성된 규칙 유추가 없습니다.&lt;/p&gt;
                        &lt;p class=&quot;text-[11px] text-slate-600&quot;&gt;집 보드에 요소를 선택하여 배치를 시작하면 규칙 엔진이 단서 조합을 통해 새 사실을 생성합니다!&lt;/p&gt;
                    &lt;/div&gt;
                `;
                return;
            }

            derivedFactsList.forEach((fact, idx) =&gt; {
                const isAlreadyOnBoard = (boardState[fact.house - 1][fact.cat] === fact.val);
                const itemEl = document.createElement(&#x27;div&#x27;);
                
                let borderBgStyle = isAlreadyOnBoard
                    ? &quot;bg-slate-900/60 border-slate-800 opacity-60&quot;
                    : &quot;bg-indigo-950/40 border-indigo-800/60 shadow-lg animate-pulse-highlight&quot;;

                itemEl.className = `p-3 rounded-xl border space-y-2 text-xs transition ${borderBgStyle}`;

                itemEl.innerHTML = `
                    &lt;div class=&quot;flex items-center justify-between&quot;&gt;
                        &lt;span class=&quot;px-2 py-0.5 rounded text-[10px] font-extrabold uppercase tracking-wider bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 flex items-center gap-1&quot;&gt;
                            &lt;i class=&quot;fa-solid fa-robot&quot;&gt;&lt;/i&gt; ${fact.ruleName}
                        &lt;/span&gt;
                        ${isAlreadyOnBoard 
                            ? `&lt;span class=&quot;text-[10px] text-emerald-400 font-bold flex items-center gap-1&quot;&gt;&lt;i class=&quot;fa-solid fa-check&quot;&gt;&lt;/i&gt; 적용됨&lt;/span&gt;` 
                            : `&lt;button onclick=&quot;applyDerivedFact(${idx})&quot; class=&quot;px-2.5 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-[11px] transition shadow flex items-center gap-1&quot;&gt;
                                &lt;i class=&quot;fa-solid fa-plus&quot;&gt;&lt;/i&gt; 사실 적용
                               &lt;/button&gt;`
                        }
                    &lt;/div&gt;

                    &lt;div class=&quot;space-y-1&quot;&gt;
                        &lt;div class=&quot;text-slate-100 font-extrabold text-xs flex items-center gap-1.5&quot;&gt;
                            &lt;span class=&quot;text-amber-400&quot;&gt;✨&lt;/span&gt; ${fact.factText}
                        &lt;/div&gt;
                        &lt;div class=&quot;text-[11px] text-slate-400 bg-slate-950/70 p-2 rounded-lg border border-slate-800/80 flex items-start gap-1.5 leading-relaxed&quot;&gt;
                            &lt;i class=&quot;fa-solid fa-link text-indigo-400 text-[10px] mt-0.5&quot;&gt;&lt;/i&gt;
                            &lt;div class=&quot;flex-1 space-y-1&quot;&gt;
                                &lt;strong&gt;추론 단서 조합 논리:&lt;/strong&gt;&lt;br/&gt;
                                ${fact.premiseHtml}
                            &lt;/div&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                `;

                feedEl.appendChild(itemEl);
            });
        }

        // 16번부터 새로운 단서가 추가되도록 동적 구현된 함수
        function addNewClueFromFact(fact) {
            const exists = currentConfig.clues.some(c =&gt; c.isDerived &amp;&amp; c.house === fact.house &amp;&amp; c.cat === fact.cat &amp;&amp; c.val === fact.val);
            if (!exists) {
                const nextNum = currentConfig.clues.length + 1;
                currentConfig.clues.push({
                    type: &#x27;fixed&#x27;, 
                    isDerived: true,
                    house: fact.house,
                    cat: fact.cat,
                    val: fact.val,
                    text: `${nextNum}. &lt;span class=&quot;text-indigo-400 font-extrabold&quot;&gt;[도출된 사실]&lt;/span&gt; ${fact.factText}`
                });
            }
        }

        function applyDerivedFact(factIdx) {
            audio.select();
            const fact = derivedFactsList[factIdx];
            if (!fact) return;

            boardState[fact.house - 1][fact.cat] = fact.val;
            boardState[fact.house - 1].candidates[fact.cat] = [];

            addNewClueFromFact(fact);

            addIfThenLog(
                fact.premiseHtml,
                fact.factText,
                fact.ruleName
            );

            renderBoard();
            renderClues();
            updateProgress();
        }

        function applyAllDerivedFacts() {
            audio.success();
            derivedFactsList.forEach((fact, idx) =&gt; {
                if (boardState[fact.house - 1][fact.cat] !== fact.val) {
                    boardState[fact.house - 1][fact.cat] = fact.val;
                    boardState[fact.house - 1].candidates[fact.cat] = [];
                    
                    addNewClueFromFact(fact);

                    addIfThenLog(
                        fact.premiseHtml,
                        fact.factText,
                        fact.ruleName
                    );
                }
            });

            renderBoard();
            renderClues();
            updateProgress();
        }

        function applyDerivedFactById(factId) {
            const idx = derivedFactsList.findIndex(f =&gt; f.id === factId);
            if (idx !== -1) {
                applyDerivedFact(idx);
                closeHintBox();
            }
        }

        function switchPuzzleMode(modeKey) {
            audio.click();
            currentModeKey = modeKey;
            
            [&#x27;classic&#x27;, &#x27;mini&#x27;, &#x27;medium&#x27;].forEach(m =&gt; {
                const btn = document.getElementById(`btn-mode-${m}`);
                if (m === modeKey) {
                    btn.className = &quot;px-2.5 py-1 text-xs font-semibold rounded-md transition bg-emerald-600 text-white shadow&quot;;
                } else {
                    btn.className = &quot;px-2.5 py-1 text-xs font-semibold text-slate-300 rounded-md hover:text-white transition&quot;;
                }
            });

            initGame(modeKey);
        }

        function initGame(modeKey) {
            currentConfig = PUZZLE_PRESETS[modeKey];
            
            // 기존에 동적으로 추가된 &quot;새로운 사실&quot; 단서들을 제거하여 초기 상태 복구
            if (currentConfig.clues) {
                currentConfig.clues = currentConfig.clues.filter(c =&gt; !c.isDerived);
            }

            pencilModeActive = false;
            document.getElementById(&#x27;pencil-status-text&#x27;).innerText = &#x27;OFF&#x27;;
            document.getElementById(&#x27;pencil-status-text&#x27;).className = &#x27;text-rose-400&#x27;;
            
            boardState = Array.from({ length: currentConfig.houseCount }, (_, i) =&gt; {
                const cellObj = { house: i + 1 };
                const candObj = {};
                currentConfig.categories.forEach(cat =&gt; {
                    cellObj[cat.id] = null;
                    candObj[cat.id] = [];
                });
                cellObj.candidates = candObj;
                return cellObj;
            });

            pauseTimer();
            timerSeconds = 0;
            updateTimerDisplay();
            updateTimerBtnUI();

            closeHintBox();
            document.getElementById(&#x27;btn-view-ai-explain&#x27;).classList.add(&#x27;hidden&#x27;);

            ifThenLogs = [];
            solvedClueTracker = new Set();
            renderIfThenStream();

            renderBoard();
            renderClues();
            updateProgress();
        }

        function startTimer() {
            if (isTimerRunning) return;
            isTimerRunning = true;
            clearInterval(timerInterval);
            timerInterval = setInterval(() =&gt; {
                timerSeconds++;
                updateTimerDisplay();
            }, 1000);
            updateTimerBtnUI();
        }

        function pauseTimer() {
            isTimerRunning = false;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            updateTimerBtnUI();
        }

        function toggleTimer() {
            audio.click();
            if (isTimerRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function updateTimerBtnUI() {
            const btn = document.getElementById(&#x27;btn-timer-toggle&#x27;);
            const icon = document.getElementById(&#x27;timer-toggle-icon&#x27;);
            const text = document.getElementById(&#x27;timer-toggle-text&#x27;);

            if (!btn || !icon || !text) return;

            if (isTimerRunning) {
                btn.className = &quot;flex items-center gap-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-xs transition shadow-md&quot;;
                icon.className = &quot;fa-solid fa-pause&quot;;
                text.innerText = &quot;일시정지&quot;;
            } else if (timerSeconds &gt; 0) {
                btn.className = &quot;flex items-center gap-1.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-xs transition shadow-md animate-pulse&quot;;
                icon.className = &quot;fa-solid fa-play&quot;;
                text.innerText = &quot;재개&quot;;
            } else {
                btn.className = &quot;flex items-center gap-1.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-xs transition shadow-md animate-pulse&quot;;
                icon.className = &quot;fa-solid fa-play&quot;;
                text.innerText = &quot;시작&quot;;
            }
        }

        function resetCurrentBoard() {
            audio.click();
            initGame(currentModeKey);
        }

        function updateTimerDisplay() {
            const m = Math.floor(timerSeconds / 60).toString().padStart(2, &#x27;0&#x27;);
            const s = (timerSeconds % 60).toString().padStart(2, &#x27;0&#x27;);
            document.getElementById(&#x27;timer-display&#x27;).innerText = `${m}:${s}`;
        }

        function togglePencilMode() {
            audio.click();
            pencilModeActive = !pencilModeActive;
            const text = document.getElementById(&#x27;pencil-status-text&#x27;);
            const btn = document.getElementById(&#x27;btn-pencil-mode&#x27;);
            if (pencilModeActive) {
                text.innerText = &#x27;ON (후보 작성)&#x27;;
                text.className = &#x27;text-amber-400 font-bold&#x27;;
                btn.classList.add(&#x27;border-amber-500/50&#x27;, &#x27;bg-amber-500/10&#x27;);
            } else {
                text.innerText = &#x27;OFF&#x27;;
                text.className = &#x27;text-rose-400&#x27;;
                btn.classList.remove(&#x27;border-amber-500/50&#x27;, &#x27;bg-amber-500/10&#x27;);
            }
        }

        function renderBoard() {
            const container = document.getElementById(&#x27;houses-container&#x27;);
            container.innerHTML = &#x27;&#x27;;

            if (currentConfig.houseCount === 3) {
                container.className = &quot;grid grid-cols-1 sm:grid-cols-3 gap-4&quot;;
            } else if (currentConfig.houseCount === 4) {
                container.className = &quot;grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3&quot;;
            } else {
                container.className = &quot;grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-5 gap-3&quot;;
            }

            boardState.forEach((houseData, idx) =&gt; {
                const houseCard = document.createElement(&#x27;div&#x27;);
                houseCard.className = &quot;bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg flex flex-col transition hover:border-slate-700 relative group&quot;;

                const colorVal = houseData.color;
                let roofBg = &quot;bg-slate-800&quot;;
                let roofStyle = &quot;&quot;;
                if (colorVal) {
                    const foundColor = currentConfig.items.color.find(c =&gt; c.name === colorVal);
                    if (foundColor) {
                        roofStyle = `background-color: ${foundColor.colorCode}`;
                    }
                }

                const roofEl = document.createElement(&#x27;div&#x27;);
                roofEl.className = &quot;p-3 flex items-center justify-between border-b border-slate-800/80 transition-colors duration-300&quot;;
                roofEl.style = roofStyle || &quot;&quot;;
                if (!roofStyle) roofEl.classList.add(roofBg);

                const textColorClass = (colorVal === &#x27;하양&#x27; || colorVal === &#x27;노랑&#x27;) ? &#x27;text-slate-950 font-black&#x27; : &#x27;text-white font-black&#x27;;

                roofEl.innerHTML = `
                    &lt;div class=&quot;flex items-center gap-2&quot;&gt;
                        &lt;span class=&quot;w-6 h-6 rounded-full bg-slate-950/40 flex items-center justify-center text-xs ${textColorClass}&quot;&gt;
                            ${idx + 1}
                        &lt;/span&gt;
                        &lt;span class=&quot;text-xs ${textColorClass} uppercase tracking-wider&quot;&gt;House ${idx + 1}&lt;/span&gt;
                    &lt;/div&gt;
                    &lt;span class=&quot;text-[11px] ${textColorClass} opacity-80&quot;&gt;${colorVal || &#x27;색상 미지정&#x27;}&lt;/span&gt;
                `;

                houseCard.appendChild(roofEl);

                const bodyEl = document.createElement(&#x27;div&#x27;);
                bodyEl.className = &quot;p-2.5 space-y-2 flex-1 flex flex-col justify-between&quot;;

                currentConfig.categories.forEach(cat =&gt; {
                    const val = houseData[cat.id];
                    const candidates = houseData.candidates[cat.id] || [];

                    const slotEl = document.createElement(&#x27;div&#x27;);
                    slotEl.onclick = () =&gt; openSelectionModal(idx, cat.id);
                    slotEl.className = `p-2 rounded-xl border transition cursor-pointer flex flex-col gap-1 min-h-[50px] justify-center ${
                        val 
                            ? &#x27;bg-slate-800/90 border-slate-700 text-slate-100 hover:border-emerald-500/50&#x27; 
                            : &#x27;bg-slate-950/50 border-slate-800/80 text-slate-500 hover:border-slate-700 hover:bg-slate-800/40&#x27;
                    }`;

                    let itemDisplayHtml = &#x27;&#x27;;
                    if (val) {
                        const itemMeta = currentConfig.items[cat.id]?.find(i =&gt; i.name === val);
                        const iconMarkup = itemMeta?.icon ? `&lt;span class=&quot;mr-1.5&quot;&gt;${itemMeta.icon}&lt;/span&gt;` : &#x27;&#x27;;
                        const colorDot = itemMeta?.colorCode ? `&lt;span class=&quot;w-2.5 h-2.5 rounded-full inline-block mr-1.5&quot; style=&quot;background:${itemMeta.colorCode}&quot;&gt;&lt;/span&gt;` : &#x27;&#x27;;

                        itemDisplayHtml = `
                            &lt;div class=&quot;flex items-center justify-between w-full&quot;&gt;
                                &lt;span class=&quot;text-[10px] text-slate-400 font-semibold uppercase tracking-wider flex items-center gap-1&quot;&gt;
                                    &lt;i class=&quot;fa-solid ${cat.icon} text-emerald-400&quot;&gt;&lt;/i&gt; ${cat.name}
                                &lt;/span&gt;
                                &lt;i class=&quot;fa-solid fa-check text-[10px] text-emerald-400&quot;&gt;&lt;/i&gt;
                            &lt;/div&gt;
                            &lt;div class=&quot;text-xs font-bold text-slate-100 flex items-center mt-0.5&quot;&gt;
                                ${colorDot}${iconMarkup}${val}
                            &lt;/div&gt;
                        `;
                    } else if (candidates.length &gt; 0) {
                        itemDisplayHtml = `
                            &lt;div class=&quot;flex items-center justify-between w-full&quot;&gt;
                                &lt;span class=&quot;text-[10px] text-amber-400/80 font-semibold uppercase tracking-wider flex items-center gap-1&quot;&gt;
                                    &lt;i class=&quot;fa-solid ${cat.icon}&quot;&gt;&lt;/i&gt; ${cat.name} (후보)
                                &lt;/span&gt;
                            &lt;/div&gt;
                            &lt;div class=&quot;flex flex-wrap gap-1 mt-0.5&quot;&gt;
                                ${candidates.map(c =&gt; `&lt;span class=&quot;px-1 py-0.2 bg-amber-500/10 text-amber-300 border border-amber-500/20 rounded text-[9px]&quot;&gt;${c}&lt;/span&gt;`).join(&#x27;&#x27;)}
                            &lt;/div&gt;
                        `;
                    } else {
                        itemDisplayHtml = `
                            &lt;div class=&quot;flex items-center justify-between w-full&quot;&gt;
                                &lt;span class=&quot;text-[10px] text-slate-500 font-semibold uppercase tracking-wider flex items-center gap-1&quot;&gt;
                                    &lt;i class=&quot;fa-solid ${cat.icon}&quot;&gt;&lt;/i&gt; ${cat.name}
                                &lt;/span&gt;
                                &lt;span class=&quot;text-[10px] text-slate-600&quot;&gt;+ 선택&lt;/span&gt;
                            &lt;/div&gt;
                            &lt;div class=&quot;text-xs text-slate-600 italic&quot;&gt;비어 있음&lt;/div&gt;
                        `;
                    }

                    slotEl.innerHTML = itemDisplayHtml;
                    bodyEl.appendChild(slotEl);
                });

                houseCard.appendChild(bodyEl);
                container.appendChild(houseCard);
            });

            renderUnassignedPalette();
        }

        function renderUnassignedPalette() {
            const paletteEl = document.getElementById(&#x27;unassigned-palette&#x27;);
            paletteEl.innerHTML = &#x27;&#x27;;

            currentConfig.categories.forEach(cat =&gt; {
                const allItems = currentConfig.items[cat.id];
                const usedItems = boardState.map(h =&gt; h[cat.id]).filter(Boolean);
                const remaining = allItems.filter(i =&gt; !usedItems.includes(i.name));

                remaining.forEach(item =&gt; {
                    const tag = document.createElement(&#x27;span&#x27;);
                    tag.className = &quot;px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-700/80 text-slate-300 flex items-center gap-1.5 shadow-sm text-xs&quot;;
                    const iconMarkup = item.icon ? `&lt;span&gt;${item.icon}&lt;/span&gt;` : &#x27;&#x27;;
                    const colorDot = item.colorCode ? `&lt;span class=&quot;w-2 h-2 rounded-full inline-block&quot; style=&quot;background:${item.colorCode}&quot;&gt;&lt;/span&gt;` : &#x27;&#x27;;
                    tag.innerHTML = `${colorDot}${iconMarkup}&lt;span class=&quot;font-medium&quot;&gt;${item.name}&lt;/span&gt; &lt;span class=&quot;text-[10px] text-slate-500&quot;&gt;(${cat.name})&lt;/span&gt;`;
                    paletteEl.appendChild(tag);
                });
            });

            if (paletteEl.children.length === 0) {

                else if (isCandidate) statusBadge = `&lt;span class=&quot;text-[10px] text-amber-400&quot;&gt;메모됨&lt;/span&gt;`;

                optBtn.innerHTML = `
                    &lt;div class=&quot;flex items-center&quot;&gt;

        function closeSelectionModal() {

        function selectItemOption(itemName, isAssignedElseWhere) {
            if (!selectedCell) return;
            const { houseIdx, catId } = selectedCell;

            if (pencilModeActive) {
                audio.select();
                const cands = boardState[houseIdx].candidates[catId];
                const candIndex = cands.indexOf(itemName);
                if (candIndex &gt;= 0) {
                    cands.splice(candIndex, 1);
                } else {
                    cands.push(itemName);
                }
            } else {
                if (isAssignedElseWhere) {
                    audio.error();
                    return;
                }
                audio.select();
                boardState[houseIdx][catId] = itemName;
                boardState[houseIdx].candidates[catId] = [];
            }

            renderBoard();
            renderClues();
            updateProgress();
            closeSelectionModal();

        function clearCurrentCell() {
            if (!selectedCell) return;
            audio.click();
            const { houseIdx, catId } = selectedCell;

            boardState[houseIdx][catId] = null;
            boardState[houseIdx].candidates[catId] = [];
            renderBoard();
            renderClues();
            updateProgress();
            closeSelectionModal();

        function evaluateClues() {
            return currentConfig.clues.map(clue =&gt; {
                let status = &#x27;incomplete&#x27;;

                switch (clue.type) {
                    case &#x27;fixed&#x27;: {
                        const h = boardState[clue.house - 1];
                        const currentVal = h[clue.cat];
                        if (currentVal === clue.val) status = &#x27;satisfied&#x27;;
                        else if (currentVal !== null &amp;&amp; currentVal !== clue.val) status = &#x27;violated&#x27;;
                        else status = &#x27;incomplete&#x27;;
                        break;
                    }
                    case &#x27;same&#x27;: {
                        let houseA = boardState.findIndex(h =&gt; h[clue.a.cat] === clue.a.val);
                        let houseB = boardState.findIndex(h =&gt; h[clue.b.cat] === clue.b.val);

                        if (houseA !== -1 &amp;&amp; houseB !== -1) {
                            status = (houseA === houseB) ? &#x27;satisfied&#x27; : &#x27;violated&#x27;;
                        } else if (houseA !== -1) {
                            const otherValInB = boardState[houseA][clue.b.cat];
                            if (otherValInB &amp;&amp; otherValInB !== clue.b.val) status = &#x27;violated&#x27;;
                        } else if (houseB !== -1) {
                            const otherValInA = boardState[houseB][clue.a.cat];
                            if (otherValInA &amp;&amp; otherValInA !== clue.a.val) status = &#x27;violated&#x27;;
                        }
                        break;
                    }
                    case &#x27;left_of&#x27;: {
                        let houseLeft = boardState.findIndex(h =&gt; h[clue.left.cat] === clue.left.val);
                        let houseRight = boardState.findIndex(h =&gt; h[clue.right.cat] === clue.right.val);

                        if (houseLeft !== -1 &amp;&amp; houseRight !== -1) {
                            status = (houseLeft + 1 === houseRight) ? &#x27;satisfied&#x27; : &#x27;violated&#x27;;
                        } else if (houseLeft !== -1) {
                            if (houseLeft === currentConfig.houseCount - 1) status = &#x27;violated&#x27;;
                        } else if (houseRight !== -1) {
                            if (houseRight === 0) status = &#x27;violated&#x27;;
                        }
                        break;
                    }
                    case &#x27;neighbor&#x27;: {
                        let houseA = boardState.findIndex(h =&gt; h[clue.a.cat] === clue.a.val);
                        let houseB = boardState.findIndex(h =&gt; h[clue.b.cat] === clue.b.val);

                        if (houseA !== -1 &amp;&amp; houseB !== -1) {
                            status = (Math.abs(houseA - houseB) === 1) ? &#x27;satisfied&#x27; : &#x27;violated&#x27;;
                        }
                        break;
                    }
                }

                return { ...clue, status };
            });
        }

        function filterClues(type) {
            audio.click();
            clueFilter = type;
            document.getElementById(&#x27;filter-all&#x27;).className = type === &#x27;all&#x27; ? &quot;px-2 py-0.5 rounded font-medium bg-emerald-600 text-white&quot; : &quot;px-2 py-0.5 rounded font-medium text-slate-400 hover:text-white&quot;;
            document.getElementById(&#x27;filter-unsolved&#x27;).className = type === &#x27;unsolved&#x27; ? &quot;px-2 py-0.5 rounded font-medium bg-emerald-600 text-white&quot; : &quot;px-2 py-0.5 rounded font-medium text-slate-400 hover:text-white&quot;;
            renderClues();
        }

        function renderClues() {
            const listEl = document.getElementById(&#x27;panel-content-clues&#x27;);
            if (!listEl) return;
            listEl.innerHTML = &#x27;&#x27;;

            const evaluated = evaluateClues();

            const filtered = evaluated.filter(c =&gt; {
                if (clueFilter === &#x27;unsolved&#x27;) return c.status !== &#x27;satisfied&#x27;;
                return true;
            });

            filtered.forEach(clue =&gt; {
                const item = document.createElement(&#x27;div&#x27;);
                
                let badgeStyle = &quot;bg-slate-800 text-slate-400 border-slate-700&quot;;
                let statusIcon = &#x27;&lt;i class=&quot;fa-regular fa-circle text-slate-500&quot;&gt;&lt;/i&gt;&#x27;;
                let statusText = &quot;미완료&quot;;

                if (clue.status === &#x27;satisfied&#x27;) {
                    badgeStyle = &quot;bg-emerald-500/10 text-emerald-400 border-emerald-500/30&quot;;
                    statusIcon = &#x27;&lt;i class=&quot;fa-solid fa-circle-check text-emerald-400&quot;&gt;&lt;/i&gt;&#x27;;
                    statusText = &quot;충족됨&quot;;
                } else if (clue.status === &#x27;violated&#x27;) {
                    badgeStyle = &quot;bg-rose-500/10 text-rose-400 border-rose-500/30&quot;;
                    statusIcon = &#x27;&lt;i class=&quot;fa-solid fa-triangle-exclamation text-rose-400&quot;&gt;&lt;/i&gt;&#x27;;
                    statusText = &quot;충돌 발생&quot;;
                }

                // 동적으로 추가된 단서인 경우 강조
                let titleMarkup = clue.isDerived 
                    ? `&lt;p class=&quot;font-medium text-indigo-300 leading-snug&quot;&gt;${clue.text}&lt;/p&gt;`
                    : `&lt;p class=&quot;font-medium text-slate-200 leading-snug&quot;&gt;${clue.text}&lt;/p&gt;`;

                item.className = `p-2.5 rounded-xl border flex items-start justify-between gap-3 text-xs transition ${badgeStyle}`;

                item.innerHTML = `
                    &lt;div class=&quot;flex items-start gap-2&quot;&gt;
                        &lt;span class=&quot;mt-0.5&quot;&gt;${statusIcon}&lt;/span&gt;
                        &lt;div&gt;
                            ${titleMarkup}
                        &lt;/div&gt;
                    &lt;/div&gt;
                    &lt;span class=&quot;text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded bg-slate-950/40 whitespace-nowrap&quot;&gt;${statusText}&lt;/span&gt;
                `;

                listEl.appendChild(item);
            });
        }

        function updateProgress() {
            const evaluated = evaluateClues();
            const satisfiedCount = evaluated.filter(c =&gt; c.status === &#x27;satisfied&#x27;).length;
            const totalClues = evaluated.length;

            const percentage = Math.round((satisfiedCount / totalClues) * 100);
            document.getElementById(&#x27;progress-bar&#x27;).style.width = `${percentage}%`;
            document.getElementById(&#x27;progress-text&#x27;).innerText = `${satisfiedCount} / ${totalClues}`;

            let totalCells = currentConfig.houseCount * currentConfig.categories.length;
            let filledCells = 0;
            boardState.forEach(h =&gt; {
                currentConfig.categories.forEach(cat =&gt; {
                    if (h[cat.id]) filledCells++;
                });
            });

            const fillPercent = Math.round((filledCells / totalCells) * 100);
            document.getElementById(&#x27;completion-status&#x27;).innerText = `${fillPercent}% 작성됨`;

            evaluated.forEach((clue, idx) =&gt; {
                if (clue.status === &#x27;satisfied&#x27; &amp;&amp; !solvedClueTracker.has(clue.text)) {
                    solvedClueTracker.add(clue.text);
                    // 동적으로 추가된 단서는 조건 충족 로그에서 제외 (중복 방지)
                    if (!clue.isDerived) {
                        addIfThenLog(
                            `&lt;div&gt;&lt;span class=&quot;text-slate-400&quot;&gt;단서 ${idx + 1} 해결 조건 만족:&lt;/span&gt;&lt;br/&gt; &quot;${clue.text}&quot;&lt;/div&gt;`,
                            `&lt;div&gt;보드의 현재 배치가 위 단서 조건을 완벽히 충족함&lt;/div&gt;`,
                            &#x27;단서 해결 달성&#x27;
                        );
                    }
                } else if (clue.status !== &#x27;satisfied&#x27; &amp;&amp; solvedClueTracker.has(clue.text)) {
                    solvedClueTracker.delete(clue.text);
                }
            });

            runRuleInferenceEngine();
        }

        function autoSolveStepByStep() {
            if (!isTimerRunning) startTimer();

            solution.forEach((solHouse, i) =&gt; {

                        boardState[i][cat.id] = solHouse[cat.id];
                        audio.select();
                        renderBoard();
                        renderClues();
                        updateProgress();
                    }, delay);
                    delay += 200;
                });
            });
        }
