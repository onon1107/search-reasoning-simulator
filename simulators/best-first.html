<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>최상 우선 탐색 — OPEN·CLOSE 리스트</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
    @font-face {
        font-family: 'KIMM';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2212@1.0/KIMM_Bold.woff2') format('woff2');
        font-weight: 700; font-display: swap;
    }
    @font-face {
        font-family: 'A2z';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/%EC%97%90%EC%9D%B4%ED%88%AC%EC%A7%80%EC%B2%B4-4Regular.woff2') format('woff2');
        font-weight: 400; font-display: swap;
    }
    @font-face {
        font-family: 'A2z';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/%EC%97%90%EC%9D%B4%ED%88%AC%EC%A7%80%EC%B2%B4-7Bold.woff2') format('woff2');
        font-weight: 700; font-display: swap;
    }
    :root {
        --white: #FFFFFF; --blue: #1C60EF; --blue-light: #DBE8FE;
        --text: #16223f; --text-muted: #55647f;
        --red: #ef4444; --red-light: #fee2e2;
        --gold: #d4a017; --gold-light: #fef3c7;
        --green: #16a34a; --green-light: #dcfce7;
        --font-title: 'KIMM', 'Malgun Gothic', sans-serif;
        --font-body: 'A2z', 'Malgun Gothic', sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0; height: 100%;
        font-family: var(--font-body); color: var(--text);
        background: var(--white); overflow: hidden; user-select: none;
    }
    .app { display: flex; flex-direction: column; height: 100%; }

    .topbar {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; flex-wrap: wrap; padding: 12px 18px;
        border-bottom: 1px solid var(--blue-light); background: #fbfcff; flex-shrink: 0;
    }
    .topbar h1 { font-family: var(--font-title); font-weight: 700; font-size: 15px; margin: 0; }
    .topbar .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    button.action {
        font-family: var(--font-body); font-weight: 700; font-size: 12.5px;
        border-radius: 8px; padding: 8px 14px; border: 1px solid var(--blue-light);
        background: var(--white); color: var(--blue); cursor: pointer;
    }
    button.action:hover:not(:disabled) { background: var(--blue-light); }
    button.action.primary { background: var(--blue); color: var(--white); border-color: var(--blue); }
    button.action.primary:hover:not(:disabled) { background: #164fce; }
    button.action:disabled { opacity: .5; cursor: default; }

    .mission {
        flex-shrink: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding: 10px 18px; border-bottom: 1px solid var(--blue-light);
        background: linear-gradient(90deg, var(--blue-light), #eef4ff);
    }
    .mission-chip {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 12.5px; font-weight: 700; background: var(--white);
        border: 1px solid rgba(28,96,239,0.22); border-radius: 999px; padding: 6px 14px;
    }
    .mission-chip .goal-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px dashed var(--gold); }
    .mission-hint { font-size: 11.5px; color: var(--text-muted); margin-left: auto; }

    .status-banner { display: none; padding: 9px 18px; font-size: 13px; font-weight: 700; text-align: center; flex-shrink: 0; }
    .status-banner.show { display: block; }
    .status-banner.ok { background: var(--gold-light); color: #92700c; }
    .status-banner.bad { background: var(--red-light); color: #b91c1c; }
    .status-banner.info { background: var(--blue-light); color: #16419e; }

    /* ---------- 좌우 분할 ---------- */
    .split { flex: 1; display: flex; min-height: 0; }
    .pane { flex: 1 1 50%; min-width: 0; display: flex; flex-direction: column; }
    .pane-left { border-right: 1px solid var(--blue-light); }
    .pane-right { transition: flex-basis 0.3s ease; }
    .pane-right.locked { flex: 0 0 0; overflow: hidden; border: 0; }

    .pane-head {
        flex-shrink: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
        padding: 9px 16px; background: #f2f6ff; border-bottom: 1px solid var(--blue-light);
        font-family: var(--font-title); font-weight: 700; font-size: 13px;
    }
    .pane-head .pane-sub { font-family: var(--font-body); font-weight: 400; font-size: 11.5px; color: var(--text-muted); }

    .h-table {
        flex-shrink: 0; display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
        padding: 8px 16px; border-bottom: 1px solid var(--blue-light); background: var(--white);
    }
    .h-table .h-label { font-size: 11.5px; font-weight: 700; color: var(--text-muted); margin-right: 2px; }
    .h-table .h-chip {
        font-size: 11.5px; font-weight: 700; color: var(--blue);
        background: var(--blue-light); border-radius: 999px; padding: 3px 9px; white-space: nowrap;
    }

    /* ---------- 지도 캔버스 ---------- */
    .map-outer {
        flex: 1; overflow: hidden; position: relative;
        background:
            radial-gradient(circle at 1px 1px, rgba(28,96,239,0.09) 1px, transparent 0) 0 0 / 22px 22px,
            var(--white);
    }
    .map-inner { position: relative; width: 100%; height: 100%; }
    .map-inner svg { position: absolute; top: 0; left: 0; pointer-events: none; }

    .city {
        position: absolute; transform: translate(-50%, -50%);
        width: 74px; border-radius: 12px; border: 2px solid var(--blue-light);
        background: var(--white); padding: 4px 3px 5px; text-align: center;
        box-shadow: 0 3px 8px rgba(28,96,239,0.10);
    }
    .city .nm { font-family: var(--font-title); font-weight: 700; font-size: 12.5px; }
    .city .hv { font-size: 10.5px; font-weight: 700; color: var(--blue); margin-top: 1px; }

    /* 왼쪽: 입력 */
    .city .f-input {
        width: 56px; margin-top: 3px; font-family: var(--font-title); font-weight: 700;
        font-size: 12.5px; text-align: center; color: var(--blue);
        border: 1.5px solid var(--blue-light); border-radius: 7px; padding: 2px 0;
        outline: none; background: #fbfcff; -moz-appearance: textfield;
    }
    .city .f-input::-webkit-outer-spin-button,
    .city .f-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .city .f-input:focus { border-color: var(--blue); background: var(--white); }
    .city .f-fixed { margin-top: 2px; font-family: var(--font-title); font-weight: 700; font-size: 11px; color: var(--text-muted); }
    .city.bad { border-color: var(--red); animation: shakeC 0.35s ease; }
    .city.bad .f-input { border-color: var(--red); color: var(--red); }
    .city.good { border-color: var(--green); }
    .city.good .f-input { border-color: var(--green); color: var(--green); background: var(--green-light); }
    .city.is-start { border-style: dashed; }
    @keyframes shakeC {
        0%, 100% { transform: translate(-50%, -50%) translateX(0); }
        25% { transform: translate(-50%, -50%) translateX(-4px); }
        75% { transform: translate(-50%, -50%) translateX(4px); }
    }

    /* 오른쪽: 탐색 */
    .city.open { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-light), 0 6px 16px rgba(28,96,239,0.20); cursor: pointer; }
    .city.open:hover { background: #f4f8ff; }
    .city.closed { background: #eef1f8; border-color: #cbd5e8; color: var(--text-muted); }
    .city.closed .hv { color: var(--text-muted); }
    .city.goal-marker { border-style: dashed; border-color: var(--gold); }
    .city.wrong { animation: shakeC 0.35s ease; border-color: var(--red); }
    .city .order-badge {
        position: absolute; top: -8px; right: -7px; background: var(--text); color: var(--white);
        font-size: 9.5px; font-weight: 700; border-radius: 999px; width: 17px; height: 17px;
        display: flex; align-items: center; justify-content: center;
    }

    .pane-foot {
        flex-shrink: 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        padding: 10px 16px; border-top: 1px solid var(--blue-light); background: #fbfcff;
    }
    .prep-msg { font-size: 12px; font-weight: 700; color: var(--text-muted); }
    .prep-msg.bad { color: #b91c1c; }
    .prep-msg.ok { color: #15803d; }

    .footer {
        flex-shrink: 0; border-top: 1px solid var(--blue-light); background: #fbfcff;
        padding: 9px 16px; display: flex; flex-direction: column; gap: 6px;
    }
    .list-row { display: flex; align-items: center; gap: 10px; }
    .list-label { font-size: 11.5px; font-weight: 700; color: var(--text-muted); flex-shrink: 0; width: 86px; white-space: nowrap; }
    .chip-track { flex: 1; min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 11.5px; font-weight: 700; }
    .chip-track .chip { border-radius: 8px; padding: 3px 9px; }
    .chip-track.open-track .chip { background: var(--blue-light); color: var(--blue); }
    .chip-track.close-track .chip { background: #e7e9ef; color: var(--text); }
    .chip-track .placeholder { color: #a9b3c7; font-weight: 400; }

    @media (max-width: 820px) {
        .split { flex-direction: column; }
        .pane-left { border-right: 0; border-bottom: 1px solid var(--blue-light); }
        .pane-right.locked { flex-basis: auto; }
    }
</style>
</head>
<body>
<div class="app">
    <div class="topbar">
        <div>
            <h1 id="title-text">최상 우선 탐색</h1>
            <div class="sub">OPEN 리스트에서 평가 함숫값 f(n)이 가장 작은 도시를 골라 목표까지 이동해 보세요.</div>
        </div>
        <div class="controls">
            <button class="action" id="btn-retry">처음부터</button>
            <button class="action primary" id="btn-new" style="display:none;">새 문제 불러오기</button>
        </div>
    </div>

    <div class="mission">
        <span class="mission-chip"><span class="goal-dot"></span>목표 상태 <span id="goal-text">서울</span></span>
        <span class="mission-chip">초기 상태 <span id="start-text">부산</span></span>
        <span class="mission-chip">선택 횟수 <b id="move-count">0</b></span>
        <span class="mission-hint" id="mission-hint">왼쪽에서 모든 도시의 f(n)을 채우면 탐색을 시작할 수 있어요.</span>
    </div>

    <div class="status-banner" id="status-banner"></div>

    <div class="split">
        <div class="pane pane-left">
            <div class="pane-head">① 평가 함숫값 채우기<span class="pane-sub" id="prep-sub">최상 우선 탐색의 평가 함숫값은 f(n) = h(n)입니다.</span></div>
            <div class="h-table" id="h-table"></div>
            <div class="map-outer" id="prep-outer">
                <div class="map-inner" id="prep-inner"><svg id="prep-svg"></svg></div>
            </div>
            <div class="pane-foot">
                <button class="action primary" id="btn-check-f">채점하기</button>
                <span class="prep-msg" id="prep-msg"></span>
            </div>
        </div>

        <div class="pane pane-right locked" id="pane-right">
            <div class="pane-head">② 탐색 순서 고르기<span class="pane-sub">OPEN 리스트에서 f(n)이 가장 작은 도시를 클릭하세요.</span></div>
            <div class="map-outer" id="map-outer">
                <div class="map-inner" id="map-inner"><svg id="svg-layer"></svg></div>
            </div>
            <div class="footer">
                <div class="list-row">
                    <span class="list-label">OPEN 리스트</span>
                    <div class="chip-track open-track" id="open-track"></div>
                </div>
                <div class="list-row">
                    <span class="list-label">CLOSE 리스트</span>
                    <div class="chip-track close-track" id="close-track"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    // ---------- 교과서 지도 (부산 → 서울) ----------
    // h: 그 도시에서 서울까지의 예상 시간(분). 부산은 초기 상태라 값이 주어지지 않는다.
    // pos: 교과서 지도에서의 위치를 0~1로 정규화한 값.
    // links: [도시A, 도시B, 걸리는 시간(분)] — 양방향이다.
    var TEXTBOOK = {
        label: {
            seoul: '서울', hongcheon: '홍천', jecheon: '제천', eumseong: '음성',
            cheonan: '천안', andong: '안동', sangju: '상주', uiseong: '의성',
            daejeon: '대전', daegu: '대구', ulsan: '울산', busan: '부산'
        },
        h: {
            seoul: 0, hongcheon: 50, cheonan: 100, eumseong: 100, jecheon: 110,
            andong: 170, daejeon: 150, sangju: 200, uiseong: 220, daegu: 240,
            ulsan: 340, busan: null
        },
        pos: {
            seoul:     [0.08, 0.13],
            hongcheon: [0.41, 0.09],
            jecheon:   [0.56, 0.20],
            eumseong:  [0.29, 0.33],
            cheonan:   [0.14, 0.39],
            andong:    [0.79, 0.37],
            sangju:    [0.46, 0.52],
            uiseong:   [0.67, 0.55],
            daejeon:   [0.19, 0.63],
            daegu:     [0.56, 0.81],
            ulsan:     [0.92, 0.80],
            busan:     [0.81, 0.94]
        },
        links: [
            ['seoul', 'hongcheon', 50],
            ['seoul', 'eumseong', 100],
            ['seoul', 'cheonan', 100],
            ['hongcheon', 'jecheon', 60],
            ['hongcheon', 'eumseong', 80],
            ['jecheon', 'andong', 60],
            ['eumseong', 'cheonan', 40],
            ['eumseong', 'sangju', 100],
            ['eumseong', 'uiseong', 200],
            ['cheonan', 'daejeon', 50],
            ['andong', 'uiseong', 50],
            ['daejeon', 'daegu', 90],
            ['sangju', 'busan', 110, 0.26],   // 네 번째 값은 라벨 위치(대구 노드와 겹치지 않게 당김)
            ['uiseong', 'ulsan', 120],
            ['daegu', 'busan', 60],
            ['ulsan', 'busan', 40]
        ],
        aspect: 347 / 258,   // 교과서 지도 이미지 비율
        start: 'busan',
        goal: 'seoul'
    };

    // 연습 문제 지도. 교과서와 같은 규칙으로 h(n) = 도착까지 실제 최단 시간이다.
    // 따라서 지도의 선만 따라가면 h를 직접 구할 수 있고, 목록으로 알려 줄 필요가 없다.
    // 셋 다 최상 우선 탐색이 A*보다 먼 길을 고른다.
    var PRACTICE = [
        {
            name: '연습 1',
            label: { goal: '도착', A: 'A', B: 'B', C: 'C', D: 'D', E: 'E', F: 'F', G: 'G', start: '출발' },
            h: { goal: 0, A: 540, B: 620, C: 560, D: 370, E: 440, F: 530, G: 210, start: null },
            pos: { goal: [0.07, 0.14], A: [0.72, 0.54], B: [0.60, 0.86], C: [0.30, 0.84], D: [0.44, 0.50], E: [0.30, 0.10], F: [0.82, 0.12], G: [0.16, 0.46], start: [0.93, 0.88] },
            links: [
                ['A', 'D', 170],
                ['D', 'G', 160],
                ['B', 'C', 60],
                ['B', 'start', 140],
                ['goal', 'G', 210],
                ['A', 'B', 120],
                ['C', 'D', 190],
                ['E', 'G', 230],
                ['A', 'start', 230],
                ['E', 'F', 90],
                ['C', 'start', 120]
            ],
            start: 'start', goal: 'goal'
        },
        {
            name: '연습 2',
            label: { goal: '도착', A: 'A', B: 'B', C: 'C', D: 'D', E: 'E', F: 'F', G: 'G', start: '출발' },
            h: { goal: 0, A: 90, B: 460, C: 260, D: 400, E: 460, F: 270, G: 470, start: null },
            pos: { goal: [0.07, 0.14], A: [0.16, 0.46], B: [0.60, 0.86], C: [0.30, 0.10], D: [0.30, 0.84], E: [0.72, 0.54], F: [0.44, 0.50], G: [0.82, 0.12], start: [0.93, 0.88] },
            links: [
                ['A', 'F', 180],
                ['E', 'F', 190],
                ['B', 'D', 60],
                ['B', 'start', 70],
                ['goal', 'A', 90],
                ['B', 'E', 200],
                ['D', 'F', 130],
                ['A', 'C', 170],
                ['E', 'start', 80],
                ['C', 'G', 210],
                ['D', 'start', 160]
            ],
            start: 'start', goal: 'goal'
        },
        {
            name: '연습 3',
            label: { goal: '도착', A: 'A', B: 'B', C: 'C', D: 'D', E: 'E', F: 'F', G: 'G', start: '출발' },
            h: { goal: 0, A: 380, B: 550, C: 370, D: 450, E: 310, F: 140, G: 80, start: null },
            pos: { goal: [0.07, 0.14], A: [0.30, 0.84], B: [0.72, 0.54], C: [0.82, 0.12], D: [0.60, 0.86], E: [0.44, 0.50], F: [0.30, 0.10], G: [0.16, 0.46], start: [0.93, 0.88] },
            links: [
                ['B', 'E', 240],
                ['E', 'G', 230],
                ['A', 'D', 70],
                ['D', 'start', 60],
                ['goal', 'G', 80],
                ['B', 'D', 160],
                ['A', 'E', 70],
                ['F', 'G', 60],
                ['B', 'start', 100],
                ['C', 'F', 230],
                ['A', 'start', 150]
            ],
            start: 'start', goal: 'goal'
        }
    ];

    // ?mode=practice 로 열면 연습 문제, 아니면 교과서 지도
    var PRACTICE_MODE = /[?&]mode=practice/.test(location.search);
    var MAP = TEXTBOOK;

    var NODE_W = 74, NODE_H_PREP = 52, NODE_H_MAP = 40;
    var PAD_X = 52, PAD_Y = 36;

    var adj = {};   // id -> [{to, cost}]
    function buildAdj() {
        adj = {};
        Object.keys(MAP.label).forEach(function (id) { adj[id] = []; });
        MAP.links.forEach(function (l) {
            adj[l[0]].push({ to: l[1], cost: l[2] });
            adj[l[1]].push({ to: l[0], cost: l[2] });
        });
    }

    function label(id) { return MAP.label[id]; }
    function allIds() { return Object.keys(MAP.label); }
    function gradableIds() { return allIds().filter(function (id) { return MAP.h[id] !== null; }); }

    var titleEl = document.getElementById('title-text');
    var baseTitle = titleEl.textContent;
    var prepOuter = document.getElementById('prep-outer');
    var prepInner = document.getElementById('prep-inner');
    var prepSvg = document.getElementById('prep-svg');
    var prepMsg = document.getElementById('prep-msg');
    var hTable = document.getElementById('h-table');
    var paneRight = document.getElementById('pane-right');
    var mapOuter = document.getElementById('map-outer');
    var mapInner = document.getElementById('map-inner');
    var svg = document.getElementById('svg-layer');
    var statusBanner = document.getElementById('status-banner');
    var openTrack = document.getElementById('open-track');
    var closeTrack = document.getElementById('close-track');
    var moveCountEl = document.getElementById('move-count');
    var missionHint = document.getElementById('mission-hint');

    var prepAnswers = {}, prepDone = false;
    var openList, closeList, moveCount, finished;

    function setBanner(kind, text) {
        statusBanner.className = 'status-banner' + (kind ? ' show ' + kind : '');
        statusBanner.textContent = text || '';
    }

    // ---------- 좌표 ----------
    function coords(outerEl) {
        var w = outerEl.clientWidth;
        var h = outerEl.clientHeight;
        // 창이 좁아져도 도시가 밖으로 밀려나지 않도록 여백을 비율로 줄인다.
        var padX = Math.min(PAD_X, w * 0.10), padY = Math.min(PAD_Y, h * 0.10);
        // 지도의 가로세로 비율을 지켜서 배치한다. 비율을 무시하고 늘리면
        // 화면상 거리가 h(직선거리)와 어긋나 보인다.
        var availW = w - padX * 2, availH = h - padY * 2;
        var boxW = availW, boxH = availH;
        // aspect가 지정된 지도(교과서)만 비율을 지킨다. 연습 지도는 h가 지도상
        // 거리와 무관하므로 창을 꽉 채워 선과 값이 잘 보이게 한다.
        if (MAP.aspect) {
            if (availW / availH > MAP.aspect) { boxH = availH; boxW = availH * MAP.aspect; }
            else { boxW = availW; boxH = availW / MAP.aspect; }
        }
        var ox = (w - boxW) / 2, oy = (h - boxH) / 2;
        var pt = {};
        allIds().forEach(function (id) {
            var p = MAP.pos[id];
            pt[id] = { x: ox + p[0] * boxW, y: oy + p[1] * boxH };
        });
        return { pt: pt, w: w, h: h };
    }

    function drawLinks(svgEl, pt, w, h) {
        svgEl.setAttribute('width', w);
        svgEl.setAttribute('height', h);
        svgEl.innerHTML = '';
        MAP.links.forEach(function (l) {
            var a = pt[l[0]], b = pt[l[1]];
            var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
            line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
            line.setAttribute('stroke', '#c7d6f9');
            line.setAttribute('stroke-width', '3');
            svgEl.appendChild(line);

            // 간선 값은 두 도시의 중간보다 살짝 안쪽에 둬서 노드 상자와 겹치지 않게 한다.
            var r = (l[3] != null) ? l[3] : 0.44;
            var mx = a.x + (b.x - a.x) * r, my = a.y + (b.y - a.y) * r;
            var txt = String(l[2]) + '분';
            var bw = txt.length * 7 + 10;
            var rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', mx - bw / 2); rect.setAttribute('y', my - 9);
            rect.setAttribute('width', bw); rect.setAttribute('height', 18);
            rect.setAttribute('rx', 9);
            rect.setAttribute('fill', '#ffffff');
            rect.setAttribute('stroke', '#c7d6f9');
            svgEl.appendChild(rect);
            var t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            t.setAttribute('x', mx); t.setAttribute('y', my + 4);
            t.setAttribute('text-anchor', 'middle');
            t.setAttribute('font-size', '11');
            t.setAttribute('font-weight', '700');
            t.setAttribute('fill', '#55647f');
            t.textContent = txt;
            svgEl.appendChild(t);
        });
    }

    // ---------- 왼쪽: f(n) 채우기 ----------
    function expectedF(id) { return MAP.h[id]; }

    function renderHTable() {
        var sub = document.getElementById('prep-sub');
        sub.textContent = PRACTICE_MODE
            ? '최상 우선 탐색의 평가 함숫값은 f(n) = h(n)입니다. 지도의 선을 따라 h(n)을 직접 구해 적어 보세요.'
            : '최상 우선 탐색의 평가 함숫값은 f(n) = h(n)입니다. 아래 목록을 보고 각 도시에 적어 보세요.';
        if (PRACTICE_MODE) {
            // 연습에서는 h가 곧 정답이므로 목록으로 알려 주지 않는다.
            // 교과서와 같은 규칙(h = 도착까지 실제 최단 시간)이라 지도에서 직접 구할 수 있다.
            hTable.innerHTML =
                '<span class="h-label">구하는 법</span>' +
                '<span class="h-chip">h(n) = 그 지점에서 ' + label(MAP.goal) + '까지 가는 가장 빠른 시간</span>' +
                '<span class="h-chip">지도의 선을 따라가며 더한 값 중 가장 작은 것</span>' +
                '<span class="h-chip">최상 우선 탐색은 f(n) = h(n)</span>';
            return;
        }
        hTable.innerHTML = '<span class="h-label">' + label(MAP.goal) + '까지 예상 시간 h(n)</span>' +
            gradableIds().map(function (id) {
                return '<span class="h-chip">' + label(id) + ' ' + MAP.h[id] + '</span>';
            }).join('');
    }

    function renderPrep() {
        if (!prepOuter.clientWidth) return;
        var c = coords(prepOuter);
        prepInner.style.width = c.w + 'px';
        prepInner.style.height = c.h + 'px';
        drawLinks(prepSvg, c.pt, c.w, c.h);
        prepInner.querySelectorAll('.city').forEach(function (el) { el.remove(); });

        allIds().forEach(function (id) {
            var el = document.createElement('div');
            el.className = 'city' + (id === MAP.start ? ' is-start' : '') + (id === MAP.goal ? ' goal-marker' : '');
            el.style.left = c.pt[id].x + 'px';
            el.style.top = c.pt[id].y + 'px';
            el.dataset.id = id;

            var nm = document.createElement('div');
            nm.className = 'nm';
            nm.textContent = label(id);
            el.appendChild(nm);

            if (expectedF(id) === null) {
                var fx = document.createElement('div');
                fx.className = 'f-fixed';
                fx.textContent = '초기 상태';
                el.appendChild(fx);
            } else {
                var input = document.createElement('input');
                input.type = 'number';
                input.className = 'f-input';
                input.dataset.id = id;
                input.setAttribute('inputmode', 'numeric');
                input.autocomplete = 'off';
                input.placeholder = 'f=?';
                if (prepAnswers[id] != null) input.value = prepAnswers[id];
                if (prepDone) input.disabled = true;
                input.addEventListener('input', function () {
                    prepAnswers[id] = input.value;
                    el.classList.remove('bad', 'good');
                });
                input.addEventListener('keydown', function (ev) {
                    if (ev.key === 'Enter') { ev.preventDefault(); checkPrep(); }
                });
                el.appendChild(input);
            }
            prepInner.appendChild(el);
        });
    }

    function checkPrep() {
        if (prepDone) return;
        var wrong = 0, blank = 0;
        gradableIds().forEach(function (id) {
            var el = prepInner.querySelector('.city[data-id="' + id + '"]');
            if (!el) return;
            var raw = (prepAnswers[id] == null ? '' : String(prepAnswers[id])).trim();
            el.classList.remove('bad', 'good');
            if (raw === '') { blank++; el.classList.add('bad'); return; }
            if (Number(raw) === expectedF(id)) el.classList.add('good');
            else { wrong++; el.classList.add('bad'); }
        });

        if (blank + wrong === 0) {
            prepDone = true;
            prepMsg.className = 'prep-msg ok';
            prepMsg.textContent = '모두 정확합니다! 오른쪽에서 탐색을 시작하세요.';
            prepInner.querySelectorAll('.f-input').forEach(function (i) { i.disabled = true; });
            document.getElementById('btn-check-f').disabled = true;
            unlockRight();
        } else {
            prepMsg.className = 'prep-msg bad';
            prepMsg.textContent = blank
                ? '아직 비어 있는 칸이 있어요. 모두 채워 주세요.'
                : '틀린 칸이 ' + wrong + '개 있어요. ' + (PRACTICE_MODE
                    ? '빨간 칸에서 ' + label(MAP.goal) + '까지 가는 길을 다시 따라가 보세요.'
                    : '빨간 칸을 다시 확인해 보세요.');
        }
    }

    function unlockRight() {
        paneRight.classList.remove('locked');
        missionHint.textContent = 'OPEN 리스트 중 f(n)이 가장 작은 도시를 클릭하세요.';
        setBanner('', '');
        setTimeout(function () { render(); renderPrep(); }, 320);
    }

    // ---------- 오른쪽: 최상 우선 탐색 ----------
    function render() {
        if (!mapOuter.clientWidth) return;
        var c = coords(mapOuter);
        mapInner.style.width = c.w + 'px';
        mapInner.style.height = c.h + 'px';
        drawLinks(svg, c.pt, c.w, c.h);
        mapInner.querySelectorAll('.city').forEach(function (el) { el.remove(); });

        allIds().forEach(function (id) {
            var isOpen = openList.indexOf(id) >= 0;
            var closedIdx = closeList.indexOf(id);
            var el = document.createElement('div');
            el.className = 'city' + (isOpen ? ' open' : '') + (closedIdx >= 0 ? ' closed' : '') +
                           (id === MAP.goal ? ' goal-marker' : '');
            el.style.left = c.pt[id].x + 'px';
            el.style.top = c.pt[id].y + 'px';
            el.dataset.id = id;

            var nm = document.createElement('div');
            nm.className = 'nm';
            nm.textContent = label(id);
            el.appendChild(nm);

            if (MAP.h[id] !== null && (isOpen || closedIdx >= 0)) {
                var hv = document.createElement('div');
                hv.className = 'hv';
                hv.textContent = 'f=' + MAP.h[id];
                el.appendChild(hv);
            }

            if (closedIdx >= 0) {
                var badge = document.createElement('div');
                badge.className = 'order-badge';
                badge.textContent = closedIdx + 1;
                el.appendChild(badge);
            }

            if (isOpen && !finished) {
                el.addEventListener('click', function () { onPick(id, el); });
            }
            mapInner.appendChild(el);
        });
    }

    function renderLists() {
        moveCountEl.textContent = moveCount;
        if (!openList.length) {
            openTrack.innerHTML = '<span class="placeholder">비어 있음</span>';
        } else {
            openTrack.innerHTML = openList.map(function (id) {
                return '<span class="chip">' + label(id) + ' (f=' + MAP.h[id] + ')</span>';
            }).join('');
        }
        closeTrack.innerHTML = closeList.length
            ? closeList.map(function (id) { return '<span class="chip">' + label(id) + '</span>'; }).join('')
            : '<span class="placeholder">비어 있음</span>';
    }

    function onPick(id, el) {
        if (finished) return;
        var best = Math.min.apply(null, openList.map(function (nid) { return MAP.h[nid]; }));
        if (MAP.h[id] > best) {
            el.classList.remove('wrong');
            void el.offsetWidth;
            el.classList.add('wrong');
            setBanner('bad', 'OPEN 리스트에 f(n)이 더 작은 도시가 있어요. 평가 함숫값이 가장 작은 도시를 다시 골라보세요.');
            return;
        }

        openList.splice(openList.indexOf(id), 1);
        closeList.push(id);
        moveCount++;

        if (id === MAP.goal) {
            finished = true;
            renderLists();
            render();
            setBanner('ok', '🎉 목표 상태 "' + label(MAP.goal) + '"에 도달했습니다! CLOSE 리스트 순서 = ' + closeList.map(label).join(' → '));
            fireConfetti();
            missionHint.textContent = '처음부터 버튼을 눌러 다시 해 볼 수 있어요.';
            return;
        }

        adj[id].forEach(function (e) {
            if (closeList.indexOf(e.to) < 0 && openList.indexOf(e.to) < 0) openList.push(e.to);
        });

        renderLists();
        render();
        setBanner('', '');
    }

    function fireConfetti() {
        if (typeof confetti !== 'function') return;
        confetti({ particleCount: 90, spread: 70, origin: { x: 0.5, y: 0.4 } });
    }

    function resetSearch() {
        closeList = [MAP.start];
        openList = adj[MAP.start].map(function (e) { return e.to; });
        moveCount = 0;
        finished = false;
        renderLists();
        render();
    }

    function resetAll() {
        prepAnswers = {};
        prepDone = false;
        prepMsg.className = 'prep-msg';
        prepMsg.textContent = '';
        document.getElementById('btn-check-f').disabled = false;
        paneRight.classList.add('locked');
        missionHint.textContent = '왼쪽에서 모든 도시의 f(n)을 채우면 탐색을 시작할 수 있어요.';
        setBanner('info', (PRACTICE_MODE ? '연습 문제입니다. ' : '교과서 지도입니다. ') + '각 지점의 f(n)을 채워 넣으면 탐색을 시작할 수 있어요.');
        resetSearch();
        renderHTable();
        renderPrep();
    }

    document.getElementById('btn-check-f').addEventListener('click', checkPrep);
    document.getElementById('btn-retry').addEventListener('click', resetAll);

    var pending = false, lastW = 0, lastH = 0, lastPW = 0, lastPH = 0;
    function scheduleRelayout() {
        if (pending) return;
        pending = true;
        var ran = false;
        function run() {
            if (ran) return;
            ran = true; pending = false;
            var w = mapOuter.clientWidth, h = mapOuter.clientHeight;
            if (w && (w !== lastW || h !== lastH)) { lastW = w; lastH = h; render(); }
            var pw = prepOuter.clientWidth, ph = prepOuter.clientHeight;
            if (pw && (pw !== lastPW || ph !== lastPH)) { lastPW = pw; lastPH = ph; renderPrep(); }
        }
        // 탭이 숨겨져 있으면 requestAnimationFrame이 멈추므로 타이머로도 한 번 더 건다.
        requestAnimationFrame(run);
        setTimeout(run, 250);
    }
    window.addEventListener('resize', scheduleRelayout);
    document.addEventListener('visibilitychange', scheduleRelayout);
    if (window.ResizeObserver) {
        new ResizeObserver(scheduleRelayout).observe(mapOuter);
        new ResizeObserver(scheduleRelayout).observe(prepOuter);
    }

    function loadMap(m) {
        MAP = m;
        buildAdj();
        document.getElementById('goal-text').textContent = MAP.label[MAP.goal];
        document.getElementById('start-text').textContent = MAP.label[MAP.start];
        titleEl.textContent = baseTitle + (m === TEXTBOOK ? ' — 교과서 지도' : ' — ' + m.name);
        resetAll();
    }

    function loadRandomPractice() {
        var next = PRACTICE[Math.floor(Math.random() * PRACTICE.length)];
        if (PRACTICE.length > 1 && next === MAP) next = PRACTICE[(PRACTICE.indexOf(next) + 1) % PRACTICE.length];
        loadMap(next);
    }

    if (PRACTICE_MODE) {
        document.getElementById('btn-new').style.display = '';
        document.getElementById('btn-new').addEventListener('click', loadRandomPractice);
        loadRandomPractice();
    } else {
        buildAdj();
        resetAll();
    }
})();
</script>
</body>
